<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>career | 채용 공고 이미지 생성 툴</title>
  <meta name="description" content="인사팀 채용 공고 이미지 자동 생성 사내용 웹 툴" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/gh/sun-typeface/SUIT@2/fonts/static/woff2/SUIT.css" rel="stylesheet" />
  <script>
    tailwind.config = {
      theme: { extend: { fontFamily: { sans: ['"Noto Sans KR"', 'sans-serif'] } } }
    }
  </script>
  <style>
    :root {
      --ui-brand: #00b1cc;
      --ui-brand-hover: #0099b3;
      --ui-brand-deep: #00829a;
      --ui-brand-soft: #e6f8fb;
      --ui-brand-border: #b3e8f1;
      --ui-brand-ring: rgba(0,177,204,.18);
      --ui-brand-shadow: rgba(0,177,204,.32);
    }
    * { box-sizing: border-box; }
    body { font-family: 'Noto Sans KR', sans-serif; background: #f1f5f9; }

    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #f1f5f9; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }

    /* ── GNB ── */
    .gnb-logo {
      display: block; flex-shrink: 0;
      height: 20px; width: auto; max-width: 154px;
      object-fit: contain; object-position: left center;
    }
    .step-pill {
      display: flex; align-items: center; gap: 5px;
      padding: 5px 12px; border-radius: 999px;
      font-size: 12px; font-weight: 600; cursor: pointer;
      transition: all 0.15s; border: none; background: none;
    }
    .step-pill-num {
      width: 18px; height: 18px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 10px; font-weight: 800; flex-shrink: 0;
    }
    .step-active { background: var(--ui-brand); color: white; box-shadow: 0 2px 8px var(--ui-brand-shadow); }
    .step-active .step-pill-num { background: white; color: var(--ui-brand-deep); }
    .step-done { color: var(--ui-brand); }
    .step-done .step-pill-num { background: var(--ui-brand-soft); color: var(--ui-brand-deep); }
    .step-idle { color: #9ca3af; }
    .step-idle .step-pill-num { background: #f1f5f9; color: #9ca3af; }

    .btn-primary {
      background: var(--ui-brand); color: #fff;
    }
    .btn-primary:hover { background: var(--ui-brand-hover); }
    .btn-dashed {
      color: var(--ui-brand);
      border-color: var(--ui-brand-border);
      background: transparent;
    }
    .btn-dashed:hover {
      background: var(--ui-brand-soft);
      border-color: var(--ui-brand);
    }

    /* ── Form controls ── */
    .f-input {
      width: 100%; border: 1.5px solid #e2e8f0; border-radius: 8px;
      padding: 9px 12px; font-size: 13px; color: #1e293b;
      font-family: 'Noto Sans KR', sans-serif;
      transition: border-color .15s, box-shadow .15s; outline: none;
      background: white;
    }
    .f-input:focus { border-color: var(--ui-brand); box-shadow: 0 0 0 3px var(--ui-brand-ring); }
    .f-textarea {
      width: 100%; border: 1.5px solid #e2e8f0; border-radius: 8px;
      padding: 9px 12px; font-size: 13px; color: #1e293b;
      font-family: 'Noto Sans KR', sans-serif;
      transition: border-color .15s, box-shadow .15s; outline: none;
      background: white; resize: vertical;
    }
    .f-textarea:focus { border-color: var(--ui-brand); box-shadow: 0 0 0 3px var(--ui-brand-ring); }
    .char-cnt { font-size: 11px; color: #94a3b8; text-align: right; margin-top: 3px; }
    .char-cnt.over { color: #ef4444; }

    /* ── Period picker (STEP 2) ── */
    .period-picker { display: flex; flex-direction: column; gap: 10px; }
    .period-row {
      display: flex; align-items: center; flex-wrap: wrap; gap: 6px;
    }
    .period-row-label {
      width: 32px; flex-shrink: 0; font-size: 12px; font-weight: 600; color: #64748b;
    }
    .period-row .f-input {
      width: auto; padding: 8px 8px; font-size: 13px;
    }
    .period-sel-year { min-width: 84px; }
    .period-sel-num { min-width: 64px; }
    .period-unit { font-size: 12px; color: #64748b; flex-shrink: 0; }
    .period-tilde { font-size: 13px; color: #94a3b8; margin: 0 2px; }

    /* ── Tip box ── */
    .tip-box { background: #fffbeb; border: 1px solid #fde68a; border-radius: 10px; padding: 14px 16px; }

    /* ── Proc track editor (Step 2) ── */
    .proc-track-card {
      border: 1px solid #e5e7eb; border-radius: 10px; padding: 12px; background: #fafbfc;
    }
    .proc-track-card + .proc-track-card { margin-top: 12px; }
    .proc-step-row {
      display: flex; align-items: center; gap: 6px;
      padding: 6px 0; border-bottom: 1px solid #f1f5f9;
      border-top: 2px solid transparent;
      transition: background .12s, border-color .12s, opacity .12s;
    }
    .proc-step-row:last-child { border-bottom: none; }
    .proc-step-row .f-input { flex: 1; min-width: 0; }
    .proc-step-row.is-dragging { opacity: .45; }
    .proc-step-row.is-drag-over { border-top-color: var(--ui-brand); background: var(--ui-brand-soft); }
    .proc-drag-handle {
      width: 28px; height: 28px; flex-shrink: 0;
      display: inline-flex; align-items: center; justify-content: center;
      border: 1px solid #e5e7eb; border-radius: 6px; background: #fff;
      color: #94a3b8; font-size: 14px; line-height: 1; letter-spacing: -1px;
      cursor: grab; user-select: none; touch-action: none;
    }
    .proc-drag-handle:hover { background: #f8fafc; color: #475569; }
    .proc-drag-handle:active { cursor: grabbing; }
    .proc-icon-btn {
      width: 28px; height: 28px; flex-shrink: 0;
      display: inline-flex; align-items: center; justify-content: center;
      border: 1px solid #e5e7eb; border-radius: 6px; background: #fff;
      color: #64748b; font-size: 11px; cursor: pointer; line-height: 1;
    }
    .proc-icon-btn:hover:not(:disabled) { background: #f8fafc; color: #1e293b; }
    .proc-icon-btn:disabled { opacity: .35; cursor: not-allowed; }
    .proc-icon-btn.is-danger { color: #94a3b8; }
    .proc-icon-btn.is-danger:hover:not(:disabled) { color: #dc2626; border-color: #fecaca; background: #fef2f2; }

    /* ── Dept / hiring form ── */
    .hire-group-card {
      border: 1px solid #e5e7eb; border-radius: 12px; background: #fff; overflow: hidden;
      border-top: 2px solid transparent;
      transition: opacity .12s, border-color .12s, box-shadow .12s;
    }
    .hire-group-card + .hire-group-card { margin-top: 14px; }
    .hire-group-card.is-dragging { opacity: .45; }
    .hire-group-card.is-drag-over {
      border-top-color: var(--ui-brand);
      box-shadow: 0 0 0 2px var(--ui-brand-soft);
    }
    .hire-group-head {
      padding: 14px; background: #f8fafc; border-bottom: 1px solid #eef2f7;
      display: flex; flex-direction: column; gap: 10px;
    }
    .dept-row-card {
      padding: 12px 14px; border-bottom: 1px solid #f1f5f9;
      display: flex; flex-direction: column; gap: 8px;
      border-top: 2px solid transparent;
      transition: background .12s, border-color .12s, opacity .12s;
    }
    .dept-row-card:last-child { border-bottom: none; }
    .dept-row-card.is-dragging { opacity: .45; }
    .dept-row-card.is-drag-over { border-top-color: var(--ui-brand); background: var(--ui-brand-soft); }
    .dept-row-top {
      display: grid; grid-template-columns: 28px 1fr minmax(120px, 0.9fr) auto;
      gap: 8px; align-items: center;
    }
    .dept-row-actions {
      display: inline-flex; align-items: center; gap: 4px; flex-shrink: 0;
    }
    .dept-row-actions .proc-icon-btn img,
    .dept-row-actions .proc-icon-btn svg {
      display: block; width: 14px; height: 14px;
    }

    /* ── Download button ── */
    .dl-btn {
      width: 100%; padding: 17px 32px;
      background: linear-gradient(135deg, var(--ui-brand-deep), var(--ui-brand), #33c1d6);
      color: white; font-size: 17px; font-weight: 700; border: none; border-radius: 12px;
      cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px;
      transition: transform .15s, box-shadow .15s; font-family: 'Noto Sans KR', sans-serif;
      box-shadow: 0 6px 24px var(--ui-brand-shadow);
    }
    .dl-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 32px rgba(0,177,204,.45); }
    .dl-btn:active { transform: none; }
    .dl-btn:disabled { opacity: .7; cursor: not-allowed; transform: none; }

    /* ── Step animation ── */
    @keyframes stepIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
    .step-anim { animation: stepIn .2s ease; }

    /* ═══════════════════════════════════════
       PREVIEW CANVAS STYLES (Figma 900px)
       ═══════════════════════════════════════ */
    #preview-canvas {
      width: 900px;
      font-family: 'SUIT', 'Noto Sans KR', sans-serif;
      background: #fff;
      color: #1e3a47;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Section 01: Cover ── */
    .pv-s01 {
      position: relative;
      width: 900px;
      height: 900px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 0 60px;
      box-sizing: border-box;
    }
    .pv-s01-bg {
      position: absolute; inset: 0; width: 100%; height: 100%;
      object-fit: cover; object-position: center; pointer-events: none;
    }
    .pv-s01-wash {
      position: absolute; inset: 0; mix-blend-mode: color; opacity: .12; pointer-events: none;
    }
    .pv-s01-inner {
      position: relative; z-index: 1; width: 100%; max-width: 780px; flex: 1; min-height: 0;
      display: flex; flex-direction: column; align-items: center;
      justify-content: space-between;
      box-sizing: border-box;
      /* 상단(최상단→badge) ≈ 220px, 하단은 로고와의 균형을 유지 */
      padding: 220px 0 180px;
    }
    .pv-s01.has-sub .pv-s01-inner {
      /* 서브카피 추가 시 텍스트 블록을 살짝 위로 */
      padding: 188px 0 180px;
    }
    .pv-s01-text {
      width: 100%; display: flex; flex-direction: column; align-items: center; gap: 34px;
      flex-shrink: 0;
    }
    .pv-badge {
      /* html2canvas: flex 수직중앙 대신 line-height=height 사용 */
      display: inline-block; box-sizing: border-box;
      min-width: 326px; height: 72px; padding: 0 30px; border-radius: 90px;
      background: rgba(255,255,255,.3); color: #fff;
      font-size: 30px; font-weight: 700; letter-spacing: -.3px;
      line-height: 72px; text-align: center; white-space: nowrap;
      vertical-align: middle;
    }
    .pv-s01-copy-wrap {
      width: 100%; display: flex; flex-direction: column; align-items: center; gap: 38px;
      text-align: center; color: #fff;
    }
    .pv-main-copy {
      width: 100%; margin: 0; color: #fff;
      font-size: 60px; font-weight: 700; line-height: 1.3; letter-spacing: -0.05em;
      white-space: pre-line; word-break: keep-all; overflow-wrap: normal; text-align: center;
    }
    .pv-sub-copy {
      width: 100%; margin: 0; color: #fff;
      font-size: 30px; font-weight: 600; line-height: 1.28;
      text-align: center; white-space: pre-wrap; word-break: keep-all;
    }
    .pv-corp-logo { width: 184px; height: 36px; display: block; flex-shrink: 0; }
    .pv-corp-badge {
      color: #fff; font-size: 28px; font-weight: 700; letter-spacing: -.4px; line-height: 1.2; white-space: nowrap;
      flex-shrink: 0;
    }

    /* ── Section 02: About ── */
    .pv-s02 {
      width: 900px; background: #f7f8fa;
      padding: 80px 60px 80px;
      display: flex; flex-direction: column; gap: 34px;
    }
    .pv-heading {
      margin: 0; font-size: 38px; font-weight: 700; line-height: 1.48; letter-spacing: -.76px;
      white-space: pre-wrap; word-break: keep-all;
      color: #00b1cc;
    }
    .pv-body {
      margin: 0; font-size: 28px; font-weight: 500; line-height: 1.6; letter-spacing: -.56px;
      color: #1e3a47; white-space: pre-wrap; word-break: keep-all;
    }

    /* ── Section 03: 모집요강 ── */
    .pv-s03 {
      width: 900px; background: #fff; padding: 124px 0;
      display: flex; flex-direction: column; gap: 124px;
    }
    .pv-info-block {
      padding: 0 60px; display: flex; flex-direction: column; gap: 42px;
    }
    .pv-sec-label {
      margin: 0; font-size: 30px; font-weight: 700; line-height: 1.5; letter-spacing: -.6px; color: #00b1cc;
    }
    .pv-info-val {
      margin: 0; font-size: 38px; font-weight: 700; line-height: 1.5; color: #1e3a47;
      word-break: keep-all; white-space: pre-wrap;
    }
    .pv-apply-row { display: flex; align-items: flex-end; gap: 20px; flex-wrap: wrap; }
    .pv-apply-title { margin: 0; font-size: 38px; font-weight: 700; line-height: 1.5; color: #1e3a47; }
    .pv-apply-url { margin: 0; font-size: 30px; font-weight: 600; line-height: 1.8; color: #1e3a47; }
    .pv-apply-flow { margin: 0; font-size: 28px; font-weight: 500; line-height: 1.5; color: #1e3a47; }
    .pv-proc-tracks { display: flex; flex-direction: column; gap: 50px; }
    .pv-proc-track { display: flex; flex-direction: column; gap: 18px; }
    .pv-proc-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .pv-proc-title {
      margin: 0; font-size: 26px; font-weight: 700; color: #1e3a47;
      height: 28px; line-height: 28px;
      display: inline-flex; align-items: center;
      /* 한글 글리프가 줄박스 하단에 붙는 광학 처짐 보정 — 칩과 맞춤 */
      transform: translateY(-0.12em);
    }
    /* Figma chip_계약형태 (265:726) */
    .pv-proc-chip {
      display: inline-flex; align-items: center; justify-content: center;
      box-sizing: border-box;
      height: 28px; padding: 0 8px; border-radius: 7px;
      font-size: 16px; font-weight: 500; line-height: 1; white-space: nowrap;
      text-align: center; flex-shrink: 0;
    }
    .pv-proc-chip .chip-sub { font-size: 14px; line-height: 1; }
    .pv-proc-chip.is-regular { background: rgba(0,177,204,.15); color: #00b1cc; }
    .pv-proc-chip.is-contract,
    .pv-proc-chip.is-contract-convert { background: rgba(98,196,0,.15); color: #5fb10d; }
    .pv-proc-chip.is-experience,
    .pv-proc-chip.is-intern { background: rgba(204,119,0,.15); color: #c80; }
    .pv-proc-chip.is-convert { background: rgba(164,93,255,.2); color: #a45dff; }
    .pv-proc-list {
      display: flex; flex-wrap: nowrap; align-items: stretch;
      justify-content: space-between; gap: 10px; width: 100%;
    }
    .pv-proc-item {
      /*
        근본 원인: display:table 은 콘텐츠 폭으로 칸이 늘어나
        '직무적합성면접' 같은 긴 한글이 한 줄로 남고 박스 너비가 제각각이 됨.
        flex + min-width:0 으로 칸 폭을 고정한 뒤 텍스트만 줄바꿈한다.
      */
      flex: 1 1 0;
      min-width: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      box-sizing: border-box;
      min-height: 73px;
      height: auto;
      background: #f7f8fa;
      border-radius: 10px;
      font-size: 22px;
      font-weight: 600;
      color: #1e3a47;
    }
    .pv-proc-item-txt {
      display: block;
      width: 100%;
      box-sizing: border-box;
      padding: 12px 10px;
      text-align: center;
      line-height: 1.35;
      /* keep-all만 쓰면 붙여 쓴 한글은 줄바꿈되지 않음 → anywhere로 강제 */
      word-break: keep-all;
      overflow-wrap: anywhere;
      white-space: normal;
    }
    /* Figma ic_process (37:711) */
    .pv-proc-dots {
      flex: 0 0 20px; width: 20px; height: 8px;
      display: inline-flex; align-items: center; justify-content: space-between;
      align-self: center;
    }
    .pv-proc-dots i {
      width: 8px; height: 8px; border-radius: 50%; display: block;
      background: #00b1cc;
    }
    .pv-proc-dots i:first-child { opacity: .2; }
    .pv-proc-dots i:last-child { opacity: .7; }
    .pv-note {
      margin: 0; font-size: 20px; font-weight: 400; line-height: 1.45; letter-spacing: -.2px; color: #7d98a5;
    }
    .pv-sched-list { width: 100%; display: flex; flex-direction: column; }
    .pv-sched-row {
      /*
        근본 원인: flex + width:140px 만으로는 min-width:auto 때문에
        제목 글자 수에 따라 열이 늘어나 날짜 시작 x가 행마다 어긋남.
        grid 고정 컬럼으로 왼쪽/오른쪽 열을 강제한다.
      */
      display: grid;
      grid-template-columns: 168px minmax(0, 1fr);
      column-gap: 24px;
      align-items: center;
      height: 88px;
      padding: 0;
      box-sizing: border-box;
      border-top: 1px solid #ced4da;
      border-bottom: 1px solid #ced4da;
      margin-top: -1px;
    }
    .pv-sched-title {
      margin: 0;
      padding: 0;
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -.24px;
      color: #1e3a47;
      line-height: 1.2;
      min-width: 0;
      transform: none;
    }
    .pv-sched-val {
      margin: 0;
      padding: 0;
      font-size: 28px;
      font-weight: 500;
      color: #1e3a47;
      line-height: 1.2;
      word-break: keep-all;
      min-width: 0;
      transform: none;
    }

    /* ── Section 04: 모집부문 ── */
    .pv-s04 { width: 900px; background: #fff; padding: 0 60px 80px; display: flex; flex-direction: column; gap: 60px; }
    .pv-s04 > .pv-sec-label { margin: 0; }
    .pv-hire-list { display: flex; flex-direction: column; gap: 70px; width: 100%; }
    .pv-hire-block { display: flex; flex-direction: column; gap: 32px; width: 100%; }
    .pv-hire-head { display: flex; flex-direction: column; align-items: flex-start; gap: 24px; width: 100%; }
    .pv-hire-logo {
      display: block; width: auto; max-width: 100%;
      object-fit: contain; object-position: left center; align-self: flex-start;
    }
    .pv-hire-logo-fallback {
      margin: 0; font-size: 22px; font-weight: 700; color: #1e3a47; line-height: 1.2;
      align-self: flex-start;
    }
    .pv-hire-intro {
      margin: 0; font-size: 20px; font-weight: 400; line-height: 1.6; color: #162d37;
      white-space: pre-wrap; word-break: keep-all;
    }
    .pv-dept-wrap { width: 100%; }
    /* 표 헤더: div 유지(글자 폭) + 패딩 수직 중앙 (line-height=height는 한글 처짐) */
    .pv-dept-head {
      display: grid;
      grid-template-columns: 18% 24% minmax(0, 1fr);
      width: 100%;
      height: auto;
      box-sizing: border-box;
      background: #f7f8fa;
      border-bottom: 1px solid #ced4da;
    }
    .pv-dept-head-cell {
      display: block;
      box-sizing: border-box;
      height: auto;
      margin: 0;
      padding: 18px 16px 20px;
      font-size: 22px;
      font-weight: 700;
      color: #1e3a47;
      line-height: 1.35;
      letter-spacing: normal;
      white-space: nowrap;
      overflow: visible;
      text-align: left;
    }
    .pv-dept-table { width: 100%; border-collapse: collapse; table-layout: fixed; }
    .pv-dept-table tbody td {
      padding: 20px 16px;
      vertical-align: top;
      border-bottom: 1px solid #ced4da;
      color: #1e3a47;
      word-break: keep-all;
      line-height: normal;
      text-align: left;
    }
    .pv-dept-table tbody tr:last-child td { border-bottom: 1px solid #ced4da; }
    .pv-dept-cat-cell {
      display: flex; flex-direction: column; align-items: flex-start; gap: 14px;
    }
    .pv-dept-cat {
      font-size: 24px; font-weight: 600; line-height: 1.4; margin: 0;
      text-align: left; width: 100%;
    }
    .pv-dept-chip {
      display: inline-flex; align-items: center; justify-content: center;
      box-sizing: border-box;
      height: 28px; padding: 0 8px; border-radius: 7px;
      font-size: 16px; font-weight: 500; line-height: 1; white-space: nowrap;
      text-align: center;
      align-self: flex-start; flex-shrink: 0;
    }
    .pv-dept-chip .chip-sub { font-size: 14px; line-height: 1; }

function createDefaultPeriodParts() {
  return {
    startYear: '',
    startMonth: '',
    startDay: '',
    endMonth: '',
    endDay: '',
    endHour: '',
    endMinute: ''
  };
}

function normalizePeriodParts(raw) {
  const d = createDefaultPeriodParts();
  if (!raw || typeof raw !== 'object') return d;
  Object.keys(d).forEach(k => {
    const v = raw[k];
    d[k] = v == null || v === '' ? '' : String(v);
  });
  return d;
}

function daysInMonth(year, month) {
  const y = Number(year);
  const m = Number(month);
  if (!y || !m) return 31;
  return new Date(y, m, 0).getDate();
}

function weekdayKo(year, month, day) {
  const d = new Date(Number(year), Number(month) - 1, Number(day));
  if (Number.isNaN(d.getTime())) return '';
  return WEEKDAY_KO[d.getDay()];
}

function formatPeriodParts(parts) {
  const p = parts || createDefaultPeriodParts();
  const sy = Number(p.startYear);
  const sm = Number(p.startMonth);
  const sd = Number(p.startDay);
  const em = Number(p.endMonth);
  const ed = Number(p.endDay);
  const eh = p.endHour === '' ? NaN : Number(p.endHour);
  const emin = p.endMinute === '' ? NaN : Number(p.endMinute);
  if (![sy, sm, sd, em, ed, eh, emin].every(n => Number.isFinite(n) && n >= 0)) return '';
  if (sy < 1000 || sy > 9999) return '';
  if (sm < 1 || sm > 12 || em < 1 || em > 12) return '';
  if (sd < 1 || sd > daysInMonth(sy, sm) || ed < 1 || ed > daysInMonth(sy, em)) return '';
  if (eh > 23 || emin > 59) return '';
  const sw = weekdayKo(sy, sm, sd);
  const ew = weekdayKo(sy, em, ed);
  return `${sy}년 ${sm}월 ${sd}일(${sw}) ~ ${em}월 ${ed}일(${ew}) ${pad2(eh)}:${pad2(emin)}`;
}

function syncPeriodFromParts() {
  S.periodParts = normalizePeriodParts(S.periodParts);
  S.period = formatPeriodParts(S.periodParts);
}

function parsePeriodString(str) {
  const s = String(str || '').trim();
  if (!s) return null;
  const m = s.match(/(\d{4})\s*년\s*(\d{1,2})\s*월\s*(\d{1,2})\s*일.*?~\s*(\d{1,2})\s*월\s*(\d{1,2})\s*일.*?(\d{1,2})\s*:\s*(\d{1,2})/);
  if (!m) return null;
  return {
    startYear: String(Number(m[1])),
    startMonth: String(Number(m[2])),
    startDay: String(Number(m[3])),
    endMonth: String(Number(m[4])),
    endDay: String(Number(m[5])),
    endHour: String(Number(m[6])),
    endMinute: String(Number(m[7]))
  };
}

function buildNumOptions(from, to, selected, pad) {
  let html = `<option value="">-</option>`;
  for (let n = from; n <= to; n++) {
    const val = String(n);
    const label = pad ? pad2(n) : val;
    html += `<option value="${val}" ${String(selected) === val ? 'selected' : ''}>${label}</option>`;
  }
  return html;
}

function buildMinuteOptions(selected) {
  let html = `<option value="">-</option>`;
  for (let n = 0; n < 60; n += 30) {
    const val = String(n);
    html += `<option value="${val}" ${String(selected) === val ? 'selected' : ''}>${pad2(n)}</option>`;
  }
  // 구버전에서 파싱된 비30분 단위 값도 표시 유지
  if (selected !== '' && selected != null && Number(selected) % 30 !== 0) {
    const n = Number(selected);
    if (Number.isFinite(n) && n >= 0 && n <= 59) {
      html += `<option value="${n}" selected>${pad2(n)}</option>`;
    }
  }
  return html;
}

function updatePeriodPart(key, value) {
  S.periodParts = normalizePeriodParts(S.periodParts);
  S.periodParts[key] = value == null ? '' : String(value);

  // 월/연 변경 시 일자 상한 보정
  if (key === 'startYear' || key === 'startMonth') {
    const max = daysInMonth(S.periodParts.startYear, S.periodParts.startMonth);
    if (S.periodParts.startDay && Number(S.periodParts.startDay) > max) S.periodParts.startDay = String(max);
    refreshPeriodDaySelect('f-period-start-day', 'startDay', max);
  }
  if (key === 'startYear' || key === 'endMonth') {
    const max = daysInMonth(S.periodParts.startYear, S.periodParts.endMonth);
    if (S.periodParts.endDay && Number(S.periodParts.endDay) > max) S.periodParts.endDay = String(max);
    refreshPeriodDaySelect('f-period-end-day', 'endDay', max);
  }

  syncPeriodFromParts();
  renderPreview();
  scheduleAutoSave();
}

function refreshPeriodDaySelect(id, partKey, maxDays) {
  const el = document.getElementById(id);
  if (!el) return;
  const selected = S.periodParts[partKey] || '';
  el.innerHTML = buildNumOptions(1, maxDays, selected, false);
}

function resolveProcChip(key) {

}

function renderProcChipHtml(chipKey) {
  const def = resolveProcChip(chipKey);
  if (def.labelSub) {
    return `<span class="pv-proc-chip ${def.chipClass}"><span>${htmlEsc(def.label)}</span><span class="chip-sub">${htmlEsc(def.labelSub)}</span></span>`;

function makeProcTrack(category, chip) {
  return {
    category: category == null ? '' : String(category),
    chip: PROC_CHIPS[chip] ? chip : 'regular',
    steps: PROC_DEFAULT_STEPS.slice()
  };
}

function normalizeProcTracks(raw) {
  if (!Array.isArray(raw) || !raw.length) return [];
  return raw.map(t => {
    // 신모델: { category, chip, steps }
    if (t && (t.category !== undefined || (t.chip && PROC_CHIPS[t.chip]))) {
      const chip = PROC_CHIPS[t.chip] ? t.chip : 'regular';
      const steps = Array.isArray(t.steps)
        ? t.steps.map(s => String(s == null ? '' : s))
        : PROC_DEFAULT_STEPS.slice();
      return {
        category: String(t.category == null ? '' : t.category),
        chip,
        steps: steps.length ? steps : ['']
      };
    }
    // 구모델: { type: 'A'|'B'|..., steps }
    const legacy = LEGACY_PROC_TYPE[t && t.type] || LEGACY_PROC_TYPE.A;
    const steps = Array.isArray(t && t.steps)
      ? t.steps.map(s => String(s == null ? '' : s))
      : legacy.defaults.slice();
    return {
      category: legacy.category,
      chip: legacy.chip,
      steps: steps.length ? steps : ['']
    };
  });
}

function renderDeptChipHtml(chipKey) {
  const def = resolveProcChip(chipKey);
  if (def.labelSub) {
    return `<span class="pv-dept-chip ${def.chipClass}"><span>${htmlEsc(def.label)}</span><span class="chip-sub">${htmlEsc(def.labelSub)}</span></span>`;
  }
  return `<span class="pv-dept-chip ${def.chipClass}">${htmlEsc(def.label)}</span>`;
}

function makeDeptRowData() {
  return { category: '', chip: 'regular', title: '', tasks: '', team: '' };
}

function makeHiringGroup(corpKey) {
  const key = CORP[corpKey] ? corpKey : 'es';
  const corp = CORP[key];
  return {
    corpKey: key,
    intro: corp.hiringIntro || corp.intro || '',
    departments: [makeDeptRowData()]
  };
}

function normalizeDeptRow(d) {
  return {
    category: String(d && d.category != null ? d.category : ''),
    chip: d && PROC_CHIPS[d.chip] ? d.chip : 'regular',
    title: String(d && d.title != null ? d.title : ''),
    tasks: String(d && d.tasks != null ? d.tasks : ''),
    team: String(d && d.team != null ? d.team : '')
  };
}

function normalizeHiringGroups(raw, legacyDepartments, fallbackCorp) {
  if (Array.isArray(raw) && raw.length) {
    return raw.map(g => {
      const corpKey = CORP[g && g.corpKey] ? g.corpKey : (CORP[fallbackCorp] ? fallbackCorp : 'es');
      const corp = CORP[corpKey];
      const departments = Array.isArray(g && g.departments)
        ? g.departments.map(normalizeDeptRow)
        : [makeDeptRowData()];
      const intro = g && g.intro != null
        ? String(g.intro)
        : (corp.hiringIntro || corp.intro || '');
      return { corpKey, intro, departments: departments.length ? departments : [makeDeptRowData()] };
    });
  }
  if (Array.isArray(legacyDepartments) && legacyDepartments.length) {
    const key = CORP[fallbackCorp] ? fallbackCorp : 'es';
    return [{
      corpKey: key,
      intro: (CORP[key].hiringIntro || CORP[key].intro || ''),
      departments: legacyDepartments.map(normalizeDeptRow)
    }];
  }
  return [];
}

function countHiringDepartments() {
  return (S.hiringGroups || []).reduce((n, g) => n + ((g.departments && g.departments.length) || 0), 0);
}

function corpLogoHtml(corp, className) {
  if (corp && corp.logo) {
    const h = Number(corp.logoHeight) || 30;
    return `<img class="${className}" src="${corp.logo}" alt="${htmlEsc(corpLabel(corp))}" style="height:${h}px;" />`;
  }
  return `<p class="pv-hire-logo-fallback">${htmlEsc(corpLabel(corp))}</p>`;
}

// STATE — 이 객체가 모든 데이터의 단일 진실 원천(Single Source of Truth)
// ─────────────────────────────────────────────────────────────
function createDefaultState() {

    docDeadline : '',
    interviewDate: '',
    announceDate : '',
    // STEP 3

    // STEP 4

  };
}

let S = createDefaultState();

// ─────────────────────────────────────────────────────────────
// LOCAL STORAGE
// ─────────────────────────────────────────────────────────────
function doSave() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(S));
  const now = new Date();
  const t = now.toTimeString().slice(0,5);
  const el = document.getElementById('save-label');
  if (el) {
    el.innerHTML = `<svg class="w-3.5 h-3.5" style="color:#16a34a" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg> 임시저장됨 ${t}`;
    el.style.color = '#16a34a';
    setTimeout(() => { el.style.color = ''; }, 3000);
  }
}

function doReset() {
  if (!confirm('작성한 내용을 모두 기본 설정으로 초기화할까요?\n임시저장된 내용도 함께 삭제됩니다.')) return;
  clearTimeout(_saveTimer);
  S = createDefaultState();
  ensureBannerCopy();
  localStorage.removeItem(STORAGE_KEY);
  setPreviewScrollTarget(previewTargetForStep(1), false);
  renderAll();
  const el = document.getElementById('save-label');
  if (el) {
    el.innerHTML = `<svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg> 초기화됨`;
    el.style.color = '';
  }
}

let _saveTimer = null;
function scheduleAutoSave() {
  clearTimeout(_saveTimer);
  _saveTimer = setTimeout(doSave, 1800);
}

function loadSaved() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return false;
    const parsed = JSON.parse(raw);
    // 안전하게 병합
    Object.keys(S).forEach(k => { if (parsed[k] !== undefined) S[k] = parsed[k]; });
    // 템플릿 키 마이그레이션 (A/B/C → recruit/story)
    if (S.template === 'A' || S.template === 'C') S.template = 'recruit';
    if (S.template === 'B') S.template = 'story';
    if (!TEMPLATES[S.template]) S.template = 'recruit';
    // 삭제된 법인 키가 저장돼 있으면 기본값으로 복구
    if (!CORP[S.corp]) {
      S.corp = 'es';
    }
    const maxStep = getMaxStep();
    if (!S.currentStep || S.currentStep < 1 || S.currentStep > maxStep) {
      S.currentStep = 1;
    }
    // 구버전 procedures[] / typeA–E → 새 procTracks 마이그레이션
    if ((!Array.isArray(S.procTracks) || !S.procTracks.length) && Array.isArray(parsed.procedures) && parsed.procedures.length) {
      S.procTracks = [{ category: '신입/경력', chip: 'regular', steps: parsed.procedures.map(String) }];
    } else {
      S.procTracks = normalizeProcTracks(S.procTracks);
    }
    delete S.procedures;
    // 구버전 departments[] → hiringGroups 마이그레이션
    S.hiringGroups = normalizeHiringGroups(parsed.hiringGroups || S.hiringGroups, parsed.departments, S.corp);
    delete S.departments;
    if (typeof S.includeUnivSub !== 'boolean') S.includeUnivSub = true;
    // 지원 기간: 구조화 필드 정규화 + 구버전 문자열 파싱
    S.periodParts = normalizePeriodParts(S.periodParts);
    let hasPeriodParts = Object.values(S.periodParts).some(v => v !== '');
    if (!hasPeriodParts && S.period) {
      const parsedPeriod = parsePeriodString(S.period);
      if (parsedPeriod) {
        S.periodParts = parsedPeriod;
        hasPeriodParts = true;
      }
    }
    syncPeriodFromParts();
    // 드롭다운으로 복원하지 못한 구버전 자유입력 문자열은 유지
    if (!S.period && !hasPeriodParts && parsed.period) S.period = String(parsed.period);
    ensureBannerCopy();
    return true;
  } catch(e) { return false; }
}

/** 회색 배너 텍스트: 비어 있으면 현재 법인 기본값으로 채움 */
function ensureBannerCopy() {
  const corp = resolveCorp();
  if (!String(S.bannerHeading || '').trim()) S.bannerHeading = corp.heading || '';
  if (!String(S.bannerIntro || '').trim()) S.bannerIntro = corp.intro || '';
}

/**
 * 법인 변경 시: 기존 값이 이전 법인 기본값(또는 비어 있음)이면 새 법인 기본값으로 교체.
 * 사용자가 수정한 문구는 유지.
 */
function syncBannerCopyOnCorpChange(prevCorpKey) {
  const corp = resolveCorp();
  const prev = prevCorpKey ? CORP[prevCorpKey] : null;
  const headingDefault = corp.heading || '';
  const introDefault = corp.intro || '';
  if (prev) {
    const wasHeadingDefault = String(S.bannerHeading || '') === String(prev.heading || '');
    const wasIntroDefault = String(S.bannerIntro || '') === String(prev.intro || '');
    if (wasHeadingDefault || !String(S.bannerHeading || '').trim()) S.bannerHeading = headingDefault;
    if (wasIntroDefault || !String(S.bannerIntro || '').trim()) S.bannerIntro = introDefault;
  } else {
    ensureBannerCopy();
  }
}

// ─────────────────────────────────────────────────────────────
// STEP NAVIGATION
// ─────────────────────────────────────────────────────────────
function goToStep(n) {
  // 현재 스텝 폼 데이터 수집 후 이동
  collectCurrentStep();
  const max = getMaxStep();
  S.currentStep = Math.max(1, Math.min(max, n));
  setPreviewScrollTarget(previewTargetForStep(S.currentStep), true);
  renderAll();
}
function nextStep() {
  if (S.currentStep < getMaxStep()) goToStep(S.currentStep + 1);
}

function renderStepNav() {
  const nav = document.getElementById('step-nav');
  if (!nav) return;
  const labels = getStepLabels();
  let html = '';
  labels.forEach((lbl, i) => {
    const step = i + 1;
    const isActive = step === S.currentStep;
    const isDone   = step < S.currentStep;
    const cls = isActive ? 'step-active' : (isDone ? 'step-done' : 'step-idle');
    html += `<button class="step-pill ${cls}" onclick="goToStep(${step})">
      <span class="step-pill-num">${step}</span>
      <span style="font-size:12px;">${lbl}</span>
    </button>`;
    if (i < labels.length - 1) html += `<span style="color:#d1d5db;font-size:14px;padding:0 1px;">›</span>`;
  });
  nav.innerHTML = html;
  const nb = document.getElementById('next-btn');
  if (nb) {
    const isLast = S.currentStep === getMaxStep();
    nb.innerHTML = isLast ? '완료 ✓' : '다음 단계 →';
  }
}

// ─────────────────────────────────────────────────────────────
// COLLECT CURRENT STEP DATA FROM DOM → STATE
// (스텝 전환 직전에 폼값을 상태에 반영)
// ─────────────────────────────────────────────────────────────
function collectCurrentStep() {
  const step = S.currentStep;
  if (step === 1) {
    const b = document.getElementById('f-badge');
    const m = document.getElementById('f-main-copy');
    const sc = document.getElementById('f-sub-copy');
    const bh = document.getElementById('f-banner-heading');
    const bi = document.getElementById('f-banner-intro');
    if (b)  S.badge    = b.value;
    if (m)  S.mainCopy = m.value;
    if (sc) S.subCopy  = sc.value;
    if (bh) S.bannerHeading = bh.value;
    if (bi) S.bannerIntro   = bi.value;
  } else if (step === 2) {
    syncPeriodFromParts();
    const doc = document.getElementById('f-doc');
    const inv = document.getElementById('f-interview');
    const ann = document.getElementById('f-announce');
    if (doc) S.docDeadline  = doc.value;
    if (inv) S.interviewDate= inv.value;
    if (ann) S.announceDate = ann.value;
  }
  // STEP 3은 updateDept()로 실시간 반영됨
}

// ─────────────────────────────────────────────────────────────
// SIDEBAR EVENTS
// ─────────────────────────────────────────────────────────────
function onTemplateChange(val) {
  collectCurrentStep();
  S.template = TEMPLATES[val] ? val : 'recruit';
  S.currentStep = 1;
  setPreviewScrollTarget(previewTargetForStep(1), true);
  renderAll();
  scheduleAutoSave();
}

function onCorpChange(val) {
  const prev = S.corp;
  if (S.currentStep === 1) collectCurrentStep();
  S.corp = CORP[val] ? val : 'es';
  syncBannerCopyOnCorpChange(prev);
  if (S.currentStep === 1) renderCenterForm();
  renderPreview();
  scheduleAutoSave();
}

function resolveCorp() {
  return CORP[S.corp] || CORP.es;
}

function resolveCorpBg(corp) {
  return (corp && corp.bg) || BG_DEFAULT;
}

function syncSidebar() {
  const st = document.getElementById('sel-template');
  const sc = document.getElementById('sel-corp');
  if (st) st.value = S.template;
  if (sc) sc.value = CORP[S.corp] ? S.corp : 'es';
  const tip = document.getElementById('sidebar-tip');
  if (tip) {
    tip.innerHTML = isStoryTemplate()
      ? '스토리는 메인 텍스트만<br/>교체한 뒤 바로 저장하세요.'
      : '법인 선택 시 메인 비주얼<br/>배경 이미지가 변경됩니다.';
  }
}

// ─────────────────────────────────────────────────────────────
// FORM RENDERERS
// ─────────────────────────────────────────────────────────────
function renderCenterForm() {
  const el = document.getElementById('center-form');
  if (!el) return;
  el.innerHTML = '';
  const wrap = document.createElement('div');
  wrap.className = 'step-anim';
  if (isStoryTemplate()) {
    if (S.currentStep === 1) wrap.innerHTML = buildStep1Story();
    else wrap.innerHTML = buildStepStorySave();
  } else if (S.currentStep === 1) wrap.innerHTML = buildStep1();
  else if (S.currentStep === 2) wrap.innerHTML = buildStep2();
  else if (S.currentStep === 3) wrap.innerHTML = buildStep3();
  else                          wrap.innerHTML = buildStep4();
  el.appendChild(wrap);
  attachFormListeners();
}

// ─── 이벤트 리스너 부착 (renderCenterForm 후 한 번에) ───
function attachFormListeners() {
  const step = S.currentStep;

  if (step === 1) {
    bindInput('f-badge',     v => { S.badge    = v; updateCnt('f-badge','cnt-badge',20); });
    bindInput('f-main-copy', v => { S.mainCopy = v; updateCnt('f-main-copy','cnt-main',60); });
    bindInput('f-sub-copy',  v => { S.subCopy  = v; updateCnt('f-sub-copy','cnt-sub',30); });
    bindInput('f-banner-heading', v => { S.bannerHeading = v; });
    bindInput('f-banner-intro',   v => { S.bannerIntro   = v; });
    // 카운터 초기화
    updateCnt('f-badge','cnt-badge',20);
    updateCnt('f-main-copy','cnt-main',60);
    updateCnt('f-sub-copy','cnt-sub',30);
  }
  if (step === 2) {
    bindInput('f-doc',       v => { S.docDeadline   = v; });
    bindInput('f-interview', v => { S.interviewDate = v; });
    bindInput('f-announce',  v => { S.announceDate  = v; });
  }
}

// 공통 input/textarea 이벤트 바인딩: 값 변경 즉시 상태 저장 + 미리보기 갱신
function bindInput(id, setter) {
  const el = document.getElementById(id);
  if (!el) return;
  el.addEventListener('input', () => {
    setter(el.value);
    renderPreview();
    scheduleAutoSave();
  });
}

function updateCnt(inputId, cntId, max) {
  const inp = document.getElementById(inputId);
  const cnt = document.getElementById(cntId);
  if (!inp || !cnt) return;
  const len = inp.value.length;
  cnt.textContent = `${len}/${max}`;
  cnt.className = 'char-cnt' + (len > max ? ' over' : '');
}

function removeProcStep(ti, si) {
  const track = S.procTracks[ti];

let procDragState = null;

function onProcStepDragStart(e, ti, si) {
  procDragState = { ti, si };
  e.dataTransfer.effectAllowed = 'move';
  e.dataTransfer.setData('text/plain', `${ti}:${si}`);
  const row = e.currentTarget.closest('.proc-step-row');
  if (row) {
    requestAnimationFrame(() => row.classList.add('is-dragging'));
  }
}

function onProcStepDragOver(e) {
  if (!procDragState) return;
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  const row = e.currentTarget;
  if (!(row instanceof HTMLElement)) return;
  document.querySelectorAll('.proc-step-row.is-drag-over').forEach(el => {
    if (el !== row) el.classList.remove('is-drag-over');
  });
  row.classList.add('is-drag-over');
}

function onProcStepDragLeave(e) {
  const row = e.currentTarget;
  if (!(row instanceof HTMLElement)) return;
  if (row.contains(e.relatedTarget)) return;
  row.classList.remove('is-drag-over');
}

function onProcStepDrop(e, ti, si) {
  e.preventDefault();
  const row = e.currentTarget;
  if (row instanceof HTMLElement) row.classList.remove('is-drag-over');
  if (!procDragState) return;
  const fromTi = procDragState.ti;
  const fromSi = procDragState.si;
  procDragState = null;
  if (fromTi !== ti || fromSi === si) return;
  const track = S.procTracks[ti];
  if (!track || !Array.isArray(track.steps)) return;
  if (fromSi < 0 || fromSi >= track.steps.length || si < 0 || si >= track.steps.length) return;
  const [moved] = track.steps.splice(fromSi, 1);
  track.steps.splice(si, 0, moved);
  refreshProcTracksEditor();
}

function onProcStepDragEnd() {
  procDragState = null;
  document.querySelectorAll('.proc-step-row.is-dragging, .proc-step-row.is-drag-over')
    .forEach(el => el.classList.remove('is-dragging', 'is-drag-over'));
}

function updateProcStep(ti, si, val) {
  const track = S.procTracks[ti];
  if (!track || !Array.isArray(track.steps)) return;
  track.steps[si] = val;
  renderPreview();
  scheduleAutoSave();
}

function moveArrayItem(arr, from, to) {
  if (!Array.isArray(arr) || from === to) return false;
  if (from < 0 || to < 0 || from >= arr.length || to >= arr.length) return false;
  const [item] = arr.splice(from, 1);
  arr.splice(to, 0, item);
  return true;
}

function onDeptDragStart(e, gi, di) {
  _deptDrag = { gi, di };
  _hireGroupDrag = null;
  e.dataTransfer.effectAllowed = 'move';

  const row = e.currentTarget && e.currentTarget.closest
    ? e.currentTarget.closest('.dept-row-card')
    : null;
  if (row) row.classList.add('is-dragging');
}

function onDeptDragOver(e) {
  if (!_deptDrag) return;
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  const row = e.currentTarget;
  if (!(row instanceof HTMLElement)) return;
  const gi = Number(row.getAttribute('data-group'));
  if (gi !== _deptDrag.gi) return;
  document.querySelectorAll('.dept-row-card.is-drag-over').forEach(el => {
    if (el !== row) el.classList.remove('is-drag-over');
  });
  row.classList.add('is-drag-over');
}

function onDeptDragLeave(e) {
  const row = e.currentTarget;
  if (!(row instanceof HTMLElement)) return;
  if (row.contains(e.relatedTarget)) return;
  row.classList.remove('is-drag-over');
}

function onDeptDrop(e, gi, di) {
  e.preventDefault();
  const row = e.currentTarget;
  if (row instanceof HTMLElement) row.classList.remove('is-drag-over');
  if (!_deptDrag || _deptDrag.gi !== gi) return;
  const from = _deptDrag.di;
  _deptDrag = null;
  const group = S.hiringGroups[gi];
  if (!group || !moveArrayItem(group.departments, from, di)) return;
  refreshHiringGroupsEditor();
}

function onDeptDragEnd() {
  _deptDrag = null;
  document.querySelectorAll('.dept-row-card.is-dragging, .dept-row-card.is-drag-over')
    .forEach(el => el.classList.remove('is-dragging', 'is-drag-over'));
}

function onHiringGroupDragStart(e, gi) {
  _hireGroupDrag = gi;
  _deptDrag = null;
  e.dataTransfer.effectAllowed = 'move';
  e.dataTransfer.setData('text/plain', `hire:${gi}`);
  const card = e.currentTarget && e.currentTarget.closest
    ? e.currentTarget.closest('.hire-group-card')
    : null;
  if (card) card.classList.add('is-dragging');
}

function onHiringGroupDragOver(e) {
  if (_hireGroupDrag === null || _hireGroupDrag === undefined) return;
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  const card = e.currentTarget;
  if (!(card instanceof HTMLElement)) return;
  document.querySelectorAll('.hire-group-card.is-drag-over').forEach(el => {
    if (el !== card) el.classList.remove('is-drag-over');
  });
  card.classList.add('is-drag-over');
}

function onHiringGroupDragLeave(e) {
  const card = e.currentTarget;
  if (!(card instanceof HTMLElement)) return;
  if (card.contains(e.relatedTarget)) return;
  card.classList.remove('is-drag-over');
}

function onHiringGroupDrop(e, gi) {
  e.preventDefault();
  const card = e.currentTarget;
  if (card instanceof HTMLElement) card.classList.remove('is-drag-over');
  if (_hireGroupDrag === null || _hireGroupDrag === undefined) return;
  const from = _hireGroupDrag;
  _hireGroupDrag = null;
  if (!moveArrayItem(S.hiringGroups, from, gi)) return;
  refreshHiringGroupsEditor();
}

function onHiringGroupDragEnd() {
  _hireGroupDrag = null;
  document.querySelectorAll('.hire-group-card.is-dragging, .hire-group-card.is-drag-over')
    .forEach(el => el.classList.remove('is-dragging', 'is-drag-over'));
}

// PREVIEW SCROLL SYNC — 폼 작성 중 해당 미리보기 영역으로 이동
// ─────────────────────────────────────────────────────────────
let _previewScrollTarget = null;
let _previewScrollTimer = null;
let _previewScrollSmooth = false;

function previewTargetForStep(step) {
  if (isStoryTemplate()) return '.pv-ig-story';
  switch (step) {
    case 1: return '#preview-s01';
    case 2: return '#preview-s03';
    case 3: return '#preview-corp-table';
    case 4: return '#preview-section05';
    default: return '#preview-s01';
  }
}

function resolvePreviewTargetFromEl(el) {
  if (!el || !el.closest) return previewTargetForStep(S.currentStep);
  const tagged = el.closest('[data-preview-target]');
  if (tagged && tagged.getAttribute('data-preview-target')) {
    let target = tagged.getAttribute('data-preview-target');
    if (target === '#preview-introduce' && S.includeUnivSub === false) {
      target = '#preview-section05';
    }
    return target;
  }
  const id = el.id || '';
  if (isStoryTemplate()) return '.pv-ig-story';
  if (id === 'f-badge' || id === 'f-main-copy' || id === 'f-sub-copy') return '#preview-s01';
  if (id === 'f-banner-heading' || id === 'f-banner-intro') return '#preview-s02';
  if (el.closest('#period-picker') || id.indexOf('f-period') === 0) return '#preview-period-block';
  if (el.closest('#proc-tracks') || el.closest('.proc-track-card')) return '#preview-proc-block';
  if (id === 'f-doc' || id === 'f-interview' || id === 'f-announce') return '#preview-sched-block';
  if (el.closest('#hire-groups') || el.closest('.hire-group-card') || el.closest('.dept-row-card')) {
    return '#preview-corp-table';
  }
  if (id === 'f-univ-sub') {
    return S.includeUnivSub !== false ? '#preview-introduce' : '#preview-section05';
  }
  return previewTargetForStep(S.currentStep);
}

function setPreviewScrollTarget(selector, smooth) {
  if (!selector) return;
  _previewScrollTarget = selector;
  _previewScrollSmooth = smooth !== false;
  schedulePreviewScroll(_previewScrollSmooth);
}

function schedulePreviewScroll(smooth) {
  if (typeof smooth === 'boolean') _previewScrollSmooth = smooth;
  clearTimeout(_previewScrollTimer);
  _previewScrollTimer = setTimeout(() => {
    requestAnimationFrame(() => scrollPreviewToTarget());
  }, 40);
}

function scrollPreviewToTarget() {
  const wrap = document.getElementById('preview-wrap');
  if (!wrap || !_previewScrollTarget) return;
  let el = wrap.querySelector(_previewScrollTarget);
  if (!el && _previewScrollTarget === '#preview-introduce') {
    el = wrap.querySelector('#preview-section05');
  }
  if (!el) return;

  const wrapRect = wrap.getBoundingClientRect();
  const elRect = el.getBoundingClientRect();
  const topPad = 24;
  const nextTop = Math.max(0, elRect.top - wrapRect.top + wrap.scrollTop - topPad);
  const delta = Math.abs(nextTop - wrap.scrollTop);
  if (delta < 8) {
    _previewScrollSmooth = false;
    return;
  }
  wrap.scrollTo({
    top: nextTop,
    behavior: _previewScrollSmooth ? 'smooth' : 'auto'
  });
  _previewScrollSmooth = false;
}

function attachPreviewScrollSync() {
  const form = document.getElementById('center-form');
  if (!form || form.dataset.previewScrollBound === '1') return;
  form.dataset.previewScrollBound = '1';
  form.addEventListener('focusin', (e) => {
    const target = resolvePreviewTargetFromEl(e.target);
    if (target) setPreviewScrollTarget(target, true);
  });
}

/** html2canvas는 background-clip:text 그라데이션을 박스로 그리므로, 캡처 전 래스터화 */
function rasterizeGradientTextForCapture(root) {
  const nodes = Array.from(root.querySelectorAll('.pv-s05-eco-title'));
  const restorers = [];
  const conf = {
    angleDeg: 6,
    stops: [
      { offset: 0.08, color: '#1ba6f7' },
      { offset: 0.27, color: '#2079ff' },
      { offset: 0.91, color: '#17d3ef' }
    ]
  };

  nodes.forEach(el => {
    const cs = getComputedStyle(el);
    const w = Math.ceil(el.offsetWidth);
    const h = Math.ceil(el.offsetHeight);
    if (!w || !h) return;

    const scale = 2;
    const c = document.createElement('canvas');
    c.width = Math.max(1, w * scale);
    c.height = Math.max(1, h * scale);
    const ctx = c.getContext('2d');
    ctx.scale(scale, scale);

    const fontSize = parseFloat(cs.fontSize) || 34;
    const fontWeight = cs.fontWeight || '700';
    const fontFamily = cs.fontFamily || "'SUIT', 'Noto Sans KR', sans-serif";
    ctx.font = `${fontWeight} ${fontSize}px ${fontFamily}`;
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';

    const rad = (conf.angleDeg * Math.PI) / 180;
    const grad = ctx.createLinearGradient(0, 0, Math.cos(rad) * w, Math.sin(rad) * h);
    conf.stops.forEach(s => grad.addColorStop(s.offset, s.color));
    ctx.fillStyle = grad;

    let lineHeight = parseFloat(cs.lineHeight);
    if (!lineHeight || Number.isNaN(lineHeight)) {
      lineHeight = fontSize * 1.68;
    }
    const tracking = parseFloat(cs.letterSpacing) || 0;
    const lines = String(el.innerText || '').replace(/\r\n/g, '\n').split('\n');
    const sample = ctx.measureText('한글Ag');
    const ascent = sample.actualBoundingBoxAscent || fontSize * 0.8;
    const descent = sample.actualBoundingBoxDescent || fontSize * 0.2;
    // 줄 박스 광학 중앙 (브라우저와 동일하게 살짝 위)
    const baselineInLine = lineHeight / 2 + (ascent - descent) / 2 - fontSize * 0.04;

    lines.forEach((line, i) => {
      const y = i * lineHeight + baselineInLine;
      if (!tracking) {
        ctx.fillText(line, 0, y);
        return;
      }
      let x = 0;
      for (const ch of line) {
        ctx.fillText(ch, x, y);
        x += ctx.measureText(ch).width + tracking;
      }
    });

    const img = document.createElement('img');
    img.src = c.toDataURL('image/png');
    img.alt = el.innerText || '';
    img.width = w;
    img.height = h;
    img.setAttribute('data-gradient-raster', '1');
    img.style.cssText = `display:block;width:${w}px;height:${h}px;margin:0;padding:0;border:0;`;

    const parent = el.parentNode;
    if (!parent) return;
    const next = el.nextSibling;
    parent.replaceChild(img, el);
    restorers.push(() => {
      if (img.parentNode === parent) parent.replaceChild(el, img);
      else if (next && next.parentNode === parent) parent.insertBefore(el, next);
      else parent.appendChild(el);
    });
  });

  return () => { restorers.forEach(fn => { try { fn(); } catch (_) {} }); };
}

/** 수직 중앙 텍스트 박스(배지/칩/전형제목) — html2canvas flex/line-height 깨짐 방지용 래스터화 */
function rasterizeVCenterBoxesForCapture(root) {
  const selectors = [
    '.pv-badge',
    '.pv-ig-badge',
    '.pv-proc-chip',
    '.pv-dept-chip',
    '.pv-proc-title'
  ];
  const nodes = Array.from(root.querySelectorAll(selectors.join(',')));
  const restorers = [];

  function roundRect(ctx, x, y, w, h, r) {
    const radius = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + radius, y);
    ctx.arcTo(x + w, y, x + w, y + h, radius);
    ctx.arcTo(x + w, y + h, x, y + h, radius);
    ctx.arcTo(x, y + h, x, y, radius);
    ctx.arcTo(x, y, x + w, y, radius);
    ctx.closePath();
  }

  function parseRadius(cs) {
    const raw = (cs.borderRadius || '0').split(' ')[0];
    return parseFloat(raw) || 0;
  }

  nodes.forEach(el => {
    const cs = getComputedStyle(el);
    const w = Math.ceil(el.offsetWidth);
    const h = Math.ceil(el.offsetHeight);
    if (!w || !h) return;

    const scale = 2;
    const c = document.createElement('canvas');
    c.width = Math.max(1, w * scale);
    c.height = Math.max(1, h * scale);
    const ctx = c.getContext('2d');
    ctx.scale(scale, scale);

    const bg = cs.backgroundColor;
    if (bg && bg !== 'rgba(0, 0, 0, 0)' && bg !== 'transparent') {
      roundRect(ctx, 0, 0, w, h, parseRadius(cs));
      ctx.fillStyle = bg;
      ctx.fill();
    }

    const fontSize = parseFloat(cs.fontSize) || 16;
    const fontWeight = cs.fontWeight || '600';
    const fontFamily = cs.fontFamily || "'SUIT', 'Noto Sans KR', sans-serif";
    ctx.font = `${fontWeight} ${fontSize}px ${fontFamily}`;
    ctx.fillStyle = cs.color || '#1e3a47';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'alphabetic';

    const tracking = parseFloat(cs.letterSpacing) || 0;
    const text = String(el.innerText || '').replace(/\s+/g, ' ').trim();
    const metrics = ctx.measureText(text || '가');
    const ascent = metrics.actualBoundingBoxAscent || fontSize * 0.8;
    const descent = metrics.actualBoundingBoxDescent || fontSize * 0.2;
    const baselineY = h / 2 + (ascent - descent) / 2 - fontSize * 0.04;

    if (!tracking) {
      ctx.fillText(text, w / 2, baselineY);
    } else {
      let total = 0;
      const chars = Array.from(text);
      chars.forEach((ch, i) => {
        total += ctx.measureText(ch).width + (i < chars.length - 1 ? tracking : 0);
      });
      let x = (w - total) / 2;
      chars.forEach((ch, i) => {
        ctx.textAlign = 'left';
        ctx.fillText(ch, x, baselineY);
        x += ctx.measureText(ch).width + tracking;
      });
    }

    const img = document.createElement('img');
    img.src = c.toDataURL('image/png');
    img.alt = text;
    img.width = w;
    img.height = h;
    img.setAttribute('data-vcenter-raster', '1');
    img.style.cssText = `display:inline-block;width:${w}px;height:${h}px;margin:0;padding:0;border:0;vertical-align:middle;flex-shrink:0;transform:none;`;
    if (el.classList.contains('pv-badge') || el.classList.contains('pv-ig-badge') ||
        el.classList.contains('pv-proc-chip') || el.classList.contains('pv-dept-chip')) {
      img.style.borderRadius = cs.borderRadius;
    }

    const parent = el.parentNode;
    if (!parent) return;
    const next = el.nextSibling;
    parent.replaceChild(img, el);
    restorers.push(() => {
      if (img.parentNode === parent) parent.replaceChild(el, img);
      else if (next && next.parentNode === parent) parent.insertBefore(el, next);
      else parent.appendChild(el);
    });
  });

  return () => { restorers.forEach(fn => { try { fn(); } catch (_) {} }); };
}

/** 한글 줄바꿈 (붙여쓴 단어도 maxWidth에서 끊음) */
function wrapCanvasText(ctx, text, maxWidth) {
  const chars = Array.from(String(text || ''));
  const lines = [];
  let line = '';
  chars.forEach(ch => {
    const test = line + ch;
    if (line && ctx.measureText(test).width > maxWidth) {
      lines.push(line);
      line = ch;
    } else {
      line = test;
    }
  });
  if (line) lines.push(line);
  return lines.length ? lines : [''];
}

/**
 * 미리보기는 OK인데 html2canvas만 깨는 레이아웃 텍스트를 픽셀로 고정.
 * - 전형단계(줄바꿈 포함)
 * - 전형일정 행(제목/날짜 열 정렬)
 * - 메인 회색 배너(.pv-s02)
 * 모집부문 표 헤더는 div+line-height로 DOM 캡처 (짧은 라벨 폭 찌그러짐 방지)
 */
function rasterizeExportLayoutTextForCapture(root) {
  const restorers = [];

  function replaceWithImg(el, img) {
    const parent = el.parentNode;
    if (!parent) return;
    const next = el.nextSibling;
    parent.replaceChild(img, el);
    restorers.push(() => {
      if (img.parentNode === parent) parent.replaceChild(el, img);
      else if (next && next.parentNode === parent) parent.insertBefore(el, next);
      else parent.appendChild(el);
    });
  }

  // 0) 메인 회색 배너 — 미리보기 박스 좌표 기준으로 픽셀 고정 (top/transform 보정 금지)
  root.querySelectorAll('.pv-s02').forEach(el => {
    const headingEl = el.querySelector('.pv-heading');
    const bodyEl = el.querySelector('.pv-body');
    if (!headingEl || !bodyEl) return;
    const w = Math.ceil(el.offsetWidth) || 900;
    const h = Math.ceil(el.offsetHeight);
    if (!w || !h) return;

    const scale = 2;
    const c = document.createElement('canvas');
    c.width = Math.max(1, w * scale);
    c.height = Math.max(1, h * scale);
    const ctx = c.getContext('2d');
    ctx.scale(scale, scale);
    ctx.fillStyle = '#f7f8fa';
    ctx.fillRect(0, 0, w, h);

    const elRect = el.getBoundingClientRect();
    const padX = 60;

    function paintPrewrapped(node) {
      const cs = getComputedStyle(node);
      const fontSize = parseFloat(cs.fontSize) || 28;
      const lineHeightRaw = cs.lineHeight;
      const lineHeight = (!lineHeightRaw || lineHeightRaw === 'normal')
        ? fontSize * 1.5
        : (parseFloat(lineHeightRaw) || fontSize * 1.5);
      const tracking = parseFloat(cs.letterSpacing) || 0;
      const nodeTop = node.getBoundingClientRect().top - elRect.top;
      ctx.font = `${cs.fontWeight || '700'} ${fontSize}px ${cs.fontFamily}`;
      ctx.fillStyle = cs.color || '#1e3a47';
      ctx.textAlign = 'left';
      ctx.textBaseline = 'alphabetic';
      const lines = String(node.innerText || '').replace(/\r\n/g, '\n').split('\n');
      const sample = ctx.measureText(lines.find(Boolean) || '가');
      const ascent = sample.actualBoundingBoxAscent || fontSize * 0.8;
      // CSS 줄박스 상단 반여백 + ascent = 첫 줄 baseline (미리보기와 동일)
      const halfLeading = Math.max(0, (lineHeight - fontSize) / 2);
      let baseline = nodeTop + halfLeading + ascent;
      lines.forEach(line => {
        if (!tracking) {
          ctx.fillText(line, padX, baseline);
        } else {
          let cx = padX;
          for (const ch of line) {
            ctx.fillText(ch, cx, baseline);
            cx += ctx.measureText(ch).width + tracking;
          }
        }
        baseline += lineHeight;
      });
    }

    paintPrewrapped(headingEl);
    paintPrewrapped(bodyEl);

    const img = document.createElement('img');
    img.src = c.toDataURL('image/png');
    img.alt = `${headingEl.innerText} ${bodyEl.innerText}`;
    img.width = w;
    img.height = h;
    img.setAttribute('data-layout-raster', '1');
    img.style.cssText = `display:block;width:${w}px;height:${h}px;margin:0;padding:0;border:0;`;
    replaceWithImg(el, img);
  });

  // 1) 전형단계 박스 — 줄바꿈 + 광학 중앙
  root.querySelectorAll('.pv-proc-item').forEach(el => {
    const cs = getComputedStyle(el);
    const txtEl = el.querySelector('.pv-proc-item-txt') || el;
    const txtCs = getComputedStyle(txtEl);
    const w = Math.ceil(el.offsetWidth);
    const h = Math.max(73, Math.ceil(el.offsetHeight));
    if (!w || !h) return;

    const scale = 2;
    const c = document.createElement('canvas');
    c.width = Math.max(1, w * scale);
    c.height = Math.max(1, h * scale);
    const ctx = c.getContext('2d');
    ctx.scale(scale, scale);

    const radius = parseFloat((cs.borderRadius || '10').split(' ')[0]) || 10;
    ctx.beginPath();
    ctx.moveTo(radius, 0);
    ctx.arcTo(w, 0, w, h, radius);
    ctx.arcTo(w, h, 0, h, radius);
    ctx.arcTo(0, h, 0, 0, radius);
    ctx.arcTo(0, 0, w, 0, radius);
    ctx.closePath();
    ctx.fillStyle = cs.backgroundColor || '#f7f8fa';
    ctx.fill();

    const fontSize = parseFloat(txtCs.fontSize) || 22;
    const lineHeight = (parseFloat(txtCs.lineHeight) || fontSize * 1.35);
    const padX = 10;
    const maxTextW = Math.max(8, w - padX * 2);
    ctx.font = `${txtCs.fontWeight || '600'} ${fontSize}px ${txtCs.fontFamily || cs.fontFamily}`;
    ctx.fillStyle = txtCs.color || '#1e3a47';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'alphabetic';

    const text = String(txtEl.innerText || '').replace(/\s+/g, ' ').trim();
    const lines = wrapCanvasText(ctx, text, maxTextW);
    const sample = ctx.measureText(lines[0] || '가');
    const ascent = sample.actualBoundingBoxAscent || fontSize * 0.8;
    const descent = sample.actualBoundingBoxDescent || fontSize * 0.2;
    const blockH = (lines.length - 1) * lineHeight + ascent + descent;
    let baselineY = (h - blockH) / 2 + ascent;

    lines.forEach(line => {
      ctx.fillText(line, w / 2, baselineY);
      baselineY += lineHeight;
    });

    const img = document.createElement('img');
    img.src = c.toDataURL('image/png');
    img.alt = text;
    img.width = w;
    img.height = h;
    img.setAttribute('data-layout-raster', '1');
    img.style.cssText = `display:block;flex:1 1 0;min-width:0;width:${w}px;height:${h}px;margin:0;padding:0;border:0;border-radius:${cs.borderRadius};`;
    replaceWithImg(el, img);
  });

  // 2) 전형일정 행 — grid 열 위치를 픽셀로 고정
  root.querySelectorAll('.pv-sched-row').forEach(el => {
    const titleEl = el.querySelector('.pv-sched-title');
    const valEl = el.querySelector('.pv-sched-val');
    if (!titleEl || !valEl) return;
    const w = Math.ceil(el.offsetWidth);
    const h = Math.max(88, Math.ceil(el.offsetHeight));
    if (!w || !h) return;

    const scale = 2;
    const c = document.createElement('canvas');
    c.width = Math.max(1, w * scale);
    c.height = Math.max(1, h * scale);
    const ctx = c.getContext('2d');
    ctx.scale(scale, scale);

    const colTitle = 168;
    const gap = 24;
    const title = String(titleEl.textContent || '').trim();
    const val = String(valEl.textContent || '').trim();
    const titleCs = getComputedStyle(titleEl);
    const valCs = getComputedStyle(valEl);

    function drawLeftText(text, cs, x) {
      const fontSize = parseFloat(cs.fontSize) || 24;
      ctx.font = `${cs.fontWeight || '700'} ${fontSize}px ${cs.fontFamily}`;
      ctx.fillStyle = cs.color || '#1e3a47';
      ctx.textAlign = 'left';
      ctx.textBaseline = 'alphabetic';
      const m = ctx.measureText(text || '가');
      const ascent = m.actualBoundingBoxAscent || fontSize * 0.8;
      const descent = m.actualBoundingBoxDescent || fontSize * 0.2;
      const baselineY = h / 2 + (ascent - descent) / 2;
      ctx.fillText(text, x, baselineY);
    }

    drawLeftText(title, titleCs, 0);
    drawLeftText(val, valCs, colTitle + gap);

    const img = document.createElement('img');
    img.src = c.toDataURL('image/png');
    img.alt = `${title} ${val}`;
    img.width = w;
    img.height = h;
    img.setAttribute('data-layout-raster', '1');
    img.style.cssText = `display:block;width:${w}px;height:${h}px;margin:0;padding:0;border:0;`;
    replaceWithImg(el, img);
    img.style.borderTop = '1px solid #ced4da';
    img.style.borderBottom = '1px solid #ced4da';
    img.style.marginTop = '-1px';
    img.style.boxSizing = 'border-box';
  });

  // 모집부문 표 헤더는 DOM(div + line-height) 그대로 캡처.
  // 칸별/행 캔버스 재그리기는 짧은 라벨(분류·직무) 글자 폭이 찌그러지는 원인이었음.

  return () => { restorers.forEach(fn => { try { fn(); } catch (_) {} }); };
}

/**
 * 복지 아이콘+제목 행 래스터화.
 * 원인: CSS align-items:center여도 한글 글리프가 em박스 하단에 붙어
 * 아이콘 대비 텍스트가 처져 보이고, html2canvas는 이 광학 차이를 더 키운다.
 * 아이콘과 텍스트를 한 이미지로 그려 광학 중앙을 고정한다.
 */
function rasterizeBenefitTitlesForCapture(root) {
  const nodes = Array.from(root.querySelectorAll('.pv-benefit-item-title'));
  const restorers = [];

  nodes.forEach(el => {
    const icon = el.querySelector('img');
    const txtEl = el.querySelector('.pv-benefit-title-txt');
    const cs = getComputedStyle(el);
    const w = Math.ceil(Math.max(el.offsetWidth, 200));
    const h = 30;
    if (!w) return;

    const scale = 2;
    const c = document.createElement('canvas');
    c.width = Math.max(1, w * scale);
    c.height = Math.max(1, h * scale);
    const ctx = c.getContext('2d');
    ctx.scale(scale, scale);

    const gap = 12;
    const iconSize = 30;
    // 아이콘: 행 기하 중앙 (미리보기 flex center와 동일)
    if (icon) {
      const iy = (h - iconSize) / 2;
      try {
        if (icon.complete && icon.naturalWidth > 0) {
          ctx.drawImage(icon, 0, iy, iconSize, iconSize);
        }
      } catch (_) {}
    }

    const text = String((txtEl && txtEl.textContent) || el.innerText || '').replace(/\s+/g, ' ').trim();
    const txtCs = txtEl ? getComputedStyle(txtEl) : cs;
    const fontSize = parseFloat(txtCs.fontSize) || 22;
    const fontWeight = txtCs.fontWeight || '700';
    const fontFamily = txtCs.fontFamily || cs.fontFamily || "'SUIT', 'Noto Sans KR', sans-serif";
    const color = txtCs.color || cs.color || '#1e3a47';
    ctx.font = `${fontWeight} ${fontSize}px ${fontFamily}`;
    ctx.fillStyle = color;
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
    const metrics = ctx.measureText(text || '가');
    const ascent = metrics.actualBoundingBoxAscent || fontSize * 0.8;
    const descent = metrics.actualBoundingBoxDescent || fontSize * 0.2;
    // 글리프 광학 중앙 = 아이콘 기하 중앙
    const baselineY = h / 2 + (ascent - descent) / 2;
    ctx.fillText(text, iconSize + gap, baselineY);

    const img = document.createElement('img');
    img.src = c.toDataURL('image/png');
    img.alt = text;
    img.width = w;
    img.height = h;
    img.setAttribute('data-benefit-raster', '1');
    img.style.cssText = `display:block;width:${w}px;height:${h}px;margin:0 0 0 0;padding:0;border:0;flex-shrink:0;`;

    const parent = el.parentNode;
    if (!parent) return;
    const next = el.nextSibling;
    parent.replaceChild(img, el);
    restorers.push(() => {
      if (img.parentNode === parent) parent.replaceChild(el, img);
      else if (next && next.parentNode === parent) parent.insertBefore(el, next);
      else parent.appendChild(el);
    });
  });

  return () => { restorers.forEach(fn => { try { fn(); } catch (_) {} }); };
}

async function downloadImage() {
  const btn    = document.getElementById('dl-btn');
  const canvas = document.getElementById('preview-canvas');
  if (!btn || !canvas) return;

  // file:// 에서는 로컬 이미지가 캔버스를 오염시켜 PNG 추출이 차단됨
  if (location.protocol === 'file:') {
    alert(
      '로컬 파일(file://)로 열면 브라우저 보안 정책 때문에 이미지 추출이 되지 않습니다.\n\n' +
      '해결 방법:\n' +
      '1) 폴더의 「로컬서버실행.command」를 더블클릭하거나\n' +
      '2) 터미널에서 아래 명령을 실행한 뒤 http://127.0.0.1:8765 로 열어주세요.\n\n' +
      'python3 -m http.server 8765'
    );
    return;
  }

  btn.disabled = true;
  btn.innerHTML = '⏳ &nbsp;이미지 캡처 중...';

  const wasStoryScaled = canvas.classList.contains('is-story');
  if (wasStoryScaled) {
    canvas.classList.remove('is-story');
    canvas.classList.add('is-story-capture');
  }

  let restoreGradientText = null;
  let restoreVCenterBoxes = null;
  let restoreBenefitTitles = null;
  let restoreLayoutText = null;
  try {
    // 이미지 로드 완료 대기 (미로드 시 캡처 실패/빈 이미지 방지)
    const imgs = Array.from(canvas.querySelectorAll('img'));
    await Promise.all(imgs.map(img => {
      if (img.complete && img.naturalWidth > 0) return Promise.resolve();
      return new Promise(resolve => {
        const done = () => resolve();
        img.addEventListener('load', done, { once: true });
        img.addEventListener('error', done, { once: true });
        // 캐시/중단 대비
        setTimeout(done, 8000);
      });
    }));
    if (document.fonts && document.fonts.ready) {
      try { await document.fonts.ready; } catch (_) {}
    }
    await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));

    // 복지 아이콘+제목
    restoreBenefitTitles = rasterizeBenefitTitlesForCapture(canvas);
    // 배지/칩/전형제목
    restoreVCenterBoxes = rasterizeVCenterBoxesForCapture(canvas);
    // 전형단계·전형일정·회색배너 래스터 / 표 헤더는 DOM 그대로
    restoreLayoutText = rasterizeExportLayoutTextForCapture(canvas);
    // background-clip:text
    restoreGradientText = rasterizeGradientTextForCapture(canvas);
    await Promise.all(
      Array.from(canvas.querySelectorAll(
        'img[data-gradient-raster="1"], img[data-vcenter-raster="1"], img[data-benefit-raster="1"], img[data-layout-raster="1"]'
      )).map(img => {
        if (img.complete && img.naturalWidth > 0) return Promise.resolve();
        return img.decode ? img.decode().catch(() => {}) : new Promise(r => {
          img.onload = () => r();
          img.onerror = () => r();
          setTimeout(r, 2000);
        });
      })
    );
    // 래스터 치환 후 레이아웃·푸터 이미지 높이 재확정
    await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));

    const storyEl = wasStoryScaled ? canvas.querySelector('.pv-ig-story') : null;
    const captureEl = storyEl || canvas;

    // overflow:hidden 은 html2canvas가 실제 높이보다 짧게 자르는 원인이 될 수 있음
    const prevOverflow = captureEl.style.overflow;
    captureEl.style.overflow = 'visible';

    function measureCaptureHeight(el) {
      const top = el.getBoundingClientRect().top;
      let bottom = el.getBoundingClientRect().bottom;
      const last = el.lastElementChild;
      if (last) bottom = Math.max(bottom, last.getBoundingClientRect().bottom);
      // nested라도 하단 배너/푸터 하단까지 포함
      el.querySelectorAll('#preview-footer, .pv-s05-footer, .pv-hire-banner').forEach(node => {
        bottom = Math.max(bottom, node.getBoundingClientRect().bottom);
      });
      return Math.max(
        Math.ceil(el.scrollHeight || 0),
        Math.ceil(el.offsetHeight || 0),
        Math.ceil(bottom - top)
      );
    }

    const w = Math.ceil(captureEl.scrollWidth || captureEl.offsetWidth || (wasStoryScaled ? 1080 : 900));
    let h = measureCaptureHeight(captureEl);
    if (!h) {
      captureEl.style.overflow = prevOverflow;
      throw new Error('미리보기 높이를 계산할 수 없습니다.');
    }
    // 서브픽셀 잘림 방지
    h += 2;

    // 해상도는 항상 유지 (채용공고 scale=2). 길면 세로 타일로 나눠 캡처 후 동일 해상도로 합성.
    const scale = isStoryTemplate() ? 1 : 2;

    function getMaxCanvasEdge() {
      const candidates = [16384, 8192, 4096];
      for (const size of candidates) {
        const c = document.createElement('canvas');
        c.width = size;
        c.height = 1;
        if (c.width === size) return size;
      }
      return 4096;
    }

    function applyCaptureClone(clonedDoc, el) {
      // 레이아웃 CSS(.is-capturing)만 적용. translateY 일괄 보정 금지.
      el.classList.add('is-capturing');
      el.style.overflow = 'visible';
      const canvasClone = clonedDoc.getElementById('preview-canvas');
      if (canvasClone) {
        canvasClone.classList.add('is-capturing');
        canvasClone.style.overflow = 'visible';
        canvasClone.style.height = 'auto';
      }
      const storyClone = clonedDoc.querySelector('.pv-ig-story');
      if (storyClone) storyClone.classList.add('is-capturing');
    }

    const baseOpts = {
      useCORS: true,
      allowTaint: false,
      backgroundColor: isStoryTemplate() ? '#00b1cc' : '#ffffff',
      scrollX: 0,
      scrollY: 0,
      logging: false,
      imageTimeout: 20000,
      foreignObjectRendering: false,
      onclone: applyCaptureClone
    };

    async function captureAtFullScale() {
      const maxEdge = getMaxCanvasEdge();
      const outW = Math.ceil(w * scale);
      const outH = Math.ceil(h * scale);

      // 한 장으로 가능하면 그대로
      if (outW <= maxEdge && outH <= maxEdge) {
        return html2canvas(captureEl, {
          ...baseOpts,
          scale,
          width: w,
          height: h,
          windowWidth: w,
          windowHeight: h
        });
      }

      // 해상도(scale)는 유지한 채 세로 구간 캡처 → 동일 해상도 캔버스에 합성
      if (outW > maxEdge) {
        throw new Error('이미지 너비가 브라우저 캔버스 한도를 초과합니다.');
      }
      const out = document.createElement('canvas');
      out.width = outW;
      out.height = outH;
      if (out.width !== outW || out.height !== outH) {
        throw new Error('브라우저가 고해상도 캔버스를 생성하지 못했습니다.');
      }
      const ctx = out.getContext('2d');
      ctx.fillStyle = baseOpts.backgroundColor;
      ctx.fillRect(0, 0, outW, outH);

      const maxSliceCss = Math.max(600, Math.floor(maxEdge / scale) - 32);
      for (let y = 0; y < h; ) {
        const sliceH = Math.min(maxSliceCss, h - y);
        const part = await html2canvas(captureEl, {
          ...baseOpts,
          scale,
          width: w,
          height: sliceH,
          x: 0,
          y,
          windowWidth: w,
          windowHeight: h
        });
        ctx.drawImage(part, 0, Math.round(y * scale));
        y += sliceH;
      }
      return out;
    }

    let result;
    try {
      result = await captureAtFullScale();
    } finally {
      captureEl.style.overflow = prevOverflow;
    }

    const corp = resolveCorp();
    const now  = new Date();
    const ds   = now.getFullYear() + pad2(now.getMonth()+1) + pad2(now.getDate());
    const prefix = isStoryTemplate() ? 'story' : 'recruit';
    const filename = `${prefix}_${(corp.name || 'poster').replace(/[^\w가-힣+-]+/g, '_')}_${ds}.png`;

    await new Promise((resolve, reject) => {
      result.toBlob(blob => {
        if (!blob) {
          reject(new Error('PNG Blob 생성에 실패했습니다.'));
          return;
        }
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.download = filename;
        a.href = url;
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 1500);
        resolve();
      }, 'image/png');
    });

    const dlLabel = isStoryTemplate() ? '📷 &nbsp;스토리 이미지 다운로드' : '📷 &nbsp;채용 공고 이미지 다운로드';
    btn.disabled = false;
    btn.innerHTML = '✅ &nbsp;다운로드 완료!';
    setTimeout(() => { btn.innerHTML = dlLabel; }, 3000);
  } catch (e) {
    console.error('[downloadImage]', e);
    btn.disabled = false;
    const msg = String(e && (e.message || e));
    const isSecurity = /security|tainted|cross-origin|cors/i.test(msg);
    btn.innerHTML = isSecurity
      ? '❌ &nbsp;로컬 서버로 다시 열어주세요'
      : '❌ &nbsp;오류 발생 - 다시 시도해주세요';
    if (isSecurity || location.protocol === 'file:') {
      alert(
        '이미지 추출에 실패했습니다.\n\n' +
        '브라우저 보안 정책으로 로컬 파일의 이미지는 PNG로 저장할 수 없습니다.\n' +
        '「로컬서버실행.command」를 실행해 http://127.0.0.1:8765 로 열어주세요.'
      );
    }
    setTimeout(() => {
      btn.innerHTML = isStoryTemplate() ? '📷 &nbsp;스토리 이미지 다운로드' : '📷 &nbsp;채용 공고 이미지 다운로드';
    }, 3000);
  } finally {
    if (typeof restoreGradientText === 'function') restoreGradientText();
    if (typeof restoreVCenterBoxes === 'function') restoreVCenterBoxes();
    if (typeof restoreBenefitTitles === 'function') restoreBenefitTitles();
    if (typeof restoreLayoutText === 'function') restoreLayoutText();
    if (wasStoryScaled) {
      canvas.classList.remove('is-story-capture');
      canvas.classList.add('is-story');
    }
  }
}

// ─────────────────────────────────────────────────────────────
// UTILS
// ─────────────────────────────────────────────────────────────
function htmlEsc(str) {
  if (str === null || str === undefined) return '';
  return String(str)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;');
}

function hexRgba(hex, a) {
  if (!hex || hex.length < 7) return `rgba(0,0,0,${a})`;
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${a})`;
}

function pad2(n) { return String(n).padStart(2,'0'); }

// ─────────────────────────────────────────────────────────────
// RENDER ALL
// ─────────────────────────────────────────────────────────────
function renderAll() {
  renderStepNav();
  renderCenterForm();
  renderPreview();
  syncSidebar();
  if (!_previewScrollTarget) {
    setPreviewScrollTarget(previewTargetForStep(S.currentStep), false);
  }
}

// ─────────────────────────────────────────────────────────────
// INIT
// ─────────────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', () => {
  const loaded = loadSaved();
  ensureBannerCopy();
  attachPreviewScrollSync();
  setPreviewScrollTarget(previewTargetForStep(S.currentStep), false);
  renderAll();
  if (loaded) {
    const el = document.getElementById('save-label');
    if (el) el.innerHTML = `<svg style="width:14px;height:14px;color:#16a34a" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg> 저장 데이터 불러옴`;
  }
  showFileProtocolNotice();
});

/** file:// 로 연 경우 이미지 추출 불가 안내 */
function showFileProtocolNotice() {
  if (location.protocol !== 'file:') return;
  if (document.getElementById('file-protocol-banner')) return;
  const bar = document.createElement('div');
  bar.id = 'file-protocol-banner';
  bar.setAttribute('role', 'alert');
  bar.style.cssText = [
    'position:fixed', 'left:0', 'right:0', 'bottom:0', 'z-index:9999',
    'background:#1e293b', 'color:#fff', 'padding:12px 18px',
    'font-size:13px', 'line-height:1.5',
    'display:flex', 'align-items:center', 'justify-content:space-between', 'gap:12px',
    'box-shadow:0 -4px 24px rgba(0,0,0,.2)'
  ].join(';');
  bar.innerHTML = `
    <span style="min-width:0;">
      <strong style="color:#fbbf24;">이미지 추출을 쓰려면 로컬 서버로 열어주세요.</strong>
      지금처럼 파일을 직접 열면(file://) 브라우저 보안 때문에 PNG 저장이 차단됩니다.
      폴더의 <code style="background:rgba(255,255,255,.12);padding:1px 6px;border-radius:4px;">로컬서버실행.command</code> 를 더블클릭하세요.
    </span>
    <button type="button" id="file-protocol-banner-close"
      style="flex-shrink:0;background:rgba(255,255,255,.14);color:#fff;border:0;border-radius:8px;padding:7px 12px;font-size:12px;font-weight:700;cursor:pointer;">
      닫기
    </button>`;
  document.body.appendChild(bar);
  const close = document.getElementById('file-protocol-banner-close');
  if (close) close.addEventListener('click', () => bar.remove());
}
</script>
