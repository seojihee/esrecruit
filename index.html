<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>career | 채용 공고 이미지 생성 툴</title>
  <meta name="description" content="인사팀 채용 공고 이미지 자동 생성 사내용 웹 툴" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <script>
    tailwind.config = {
      theme: { extend: { fontFamily: { sans: ['"Noto Sans KR"', 'sans-serif'] } } }
    }
  </script>
  <style>
    * { box-sizing: border-box; }
    body { font-family: 'Noto Sans KR', sans-serif; background: #f1f5f9; }

    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #f1f5f9; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }

    /* ── GNB ── */
    .gnb-logo {
      background: #1d4ed8; color: white; font-weight: 900;
      font-size: 17px; letter-spacing: -0.04em; padding: 5px 12px;
      border-radius: 6px; font-style: italic; flex-shrink: 0;
    }
    .step-pill {
      display: flex; align-items: center; gap: 5px;
      padding: 5px 12px; border-radius: 999px;
      font-size: 12px; font-weight: 600; cursor: pointer;
      transition: all 0.15s; border: none; background: none;
    }
    .step-pill-num {
      width: 18px; height: 18px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 10px; font-weight: 800; flex-shrink: 0;
    }
    .step-active { background: #2563eb; color: white; box-shadow: 0 2px 8px rgba(37,99,235,.3); }
    .step-active .step-pill-num { background: white; color: #1d4ed8; }
    .step-done { color: #2563eb; }
    .step-done .step-pill-num { background: #dbeafe; color: #1d4ed8; }
    .step-idle { color: #9ca3af; }
    .step-idle .step-pill-num { background: #f1f5f9; color: #9ca3af; }

    /* ── Form controls ── */
    .f-input {
      width: 100%; border: 1.5px solid #e2e8f0; border-radius: 8px;
      padding: 9px 12px; font-size: 13px; color: #1e293b;
      font-family: 'Noto Sans KR', sans-serif;
      transition: border-color .15s, box-shadow .15s; outline: none;
      background: white;
    }
    .f-input:focus { border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59,130,246,.15); }
    .f-textarea {
      width: 100%; border: 1.5px solid #e2e8f0; border-radius: 8px;
      padding: 9px 12px; font-size: 13px; color: #1e293b;
      font-family: 'Noto Sans KR', sans-serif;
      transition: border-color .15s, box-shadow .15s; outline: none;
      background: white; resize: vertical;
    }
    .f-textarea:focus { border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59,130,246,.15); }
    .char-cnt { font-size: 11px; color: #94a3b8; text-align: right; margin-top: 3px; }
    .char-cnt.over { color: #ef4444; }

    /* ── Color swatch ── */
    .color-swatch {
      width: 28px; height: 28px; border-radius: 50%; cursor: pointer;
      border: 3px solid transparent; transition: transform .15s, box-shadow .15s;
      flex-shrink: 0;
    }
    .color-swatch:hover { transform: scale(1.15); }
    .color-swatch.on { border-color: white; box-shadow: 0 0 0 3px #2563eb; }

    /* ── Pattern buttons ── */
    .pat-btn {
      width: 68px; height: 48px; border-radius: 8px; cursor: pointer;
      border: 2.5px solid transparent; overflow: hidden; transition: border-color .15s, box-shadow .15s;
    }
    .pat-btn.on { border-color: #2563eb; box-shadow: 0 0 0 2px rgba(37,99,235,.25); }

    /* ── Tip box ── */
    .tip-box { background: #fffbeb; border: 1px solid #fde68a; border-radius: 10px; padding: 14px 16px; }

    /* ── Proc tag ── */
    .proc-tag {
      display: inline-flex; align-items: center; gap: 3px;
      background: #eff6ff; color: #1d4ed8; border: 1px solid #bfdbfe;
      border-radius: 6px; padding: 3px 9px; font-size: 12px; font-weight: 500;
    }

    /* ── Dept row ── */
    .dept-form-row {
      display: grid; grid-template-columns: 88px 128px 1fr 34px;
      gap: 8px; padding: 10px 0; border-bottom: 1px solid #f1f5f9; align-items: start;
    }
    .dept-form-row:last-child { border-bottom: none; }

    /* ── Download button ── */
    .dl-btn {
      width: 100%; padding: 17px 32px;
      background: linear-gradient(135deg, #1e40af, #2563eb, #3b82f6);
      color: white; font-size: 17px; font-weight: 700; border: none; border-radius: 12px;
      cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px;
      transition: transform .15s, box-shadow .15s; font-family: 'Noto Sans KR', sans-serif;
      box-shadow: 0 6px 24px rgba(37,99,235,.4);
    }
    .dl-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 32px rgba(37,99,235,.5); }
    .dl-btn:active { transform: none; }
    .dl-btn:disabled { opacity: .7; cursor: not-allowed; transform: none; }

    /* ── Step animation ── */
    @keyframes stepIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
    .step-anim { animation: stepIn .2s ease; }

    /* ═══════════════════════════════════════
       PREVIEW CANVAS STYLES
       ═══════════════════════════════════════ */
    #preview-canvas { width: 600px; font-family: 'Noto Sans KR', sans-serif; background: white; }

    /* Section 01: Main Visual */
    .pv-s01 {
      position: relative; width: 600px; height: 440px; overflow: hidden;
    }
    .pv-s01-bg {
      position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;
    }
    .pv-s01-wash {
      position: absolute; inset: 0; mix-blend-mode: multiply; opacity: .38;
    }
    .pv-s01-inner {
      position: absolute; inset: 0; display: flex; flex-direction: column;
      justify-content: center; align-items: flex-start; padding: 52px 60px; gap: 10px;
    }
    .pv-badge {
      display: inline-block; background: rgba(255,255,255,.22); color: white;
      font-size: 12px; font-weight: 700; padding: 5px 14px; border-radius: 20px;
      border: 1px solid rgba(255,255,255,.4); letter-spacing: .04em;
    }
    .pv-main-copy {
      color: white; font-size: 34px; font-weight: 900; line-height: 1.35;
      white-space: pre-wrap; word-break: keep-all;
      text-shadow: 0 2px 16px rgba(0,0,0,.15); margin: 6px 0;
    }
    .pv-sub-copy { color: rgba(255,255,255,.88); font-size: 14px; }
    .pv-corp-badge {
      position: absolute; bottom: 32px; right: 48px;
      color: white; font-size: 16px; font-weight: 800; letter-spacing: .04em; opacity: .92;
    }

    /* Section 02: Company Intro */
    .pv-s02 {
      width: 600px; background: white; padding: 40px 56px 32px; border-bottom: 1px solid #e8ecf0;
    }
    .pv-sec-label {
      font-size: 10px; font-weight: 800; letter-spacing: .18em; text-transform: uppercase; margin-bottom: 14px;
    }
    .pv-heading {
      font-size: 21px; font-weight: 900; line-height: 1.4; color: #111827;
      margin-bottom: 12px; white-space: pre-wrap; word-break: keep-all;
    }
    .pv-body { font-size: 13px; color: #4b5563; line-height: 1.85; white-space: pre-wrap; word-break: keep-all; }

    /* Section 03: Recruitment Info */
    .pv-s03 { width: 600px; background: #f8fafc; padding: 36px 56px; border-bottom: 1px solid #e8ecf0; }
    .pv-info-block { margin-bottom: 28px; }
    .pv-info-block:last-child { margin-bottom: 0; }
    .pv-info-val { font-size: 20px; font-weight: 800; color: #0f172a; line-height: 1.3; word-break: keep-all; }
    .pv-proc-list { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 6px; }
    .pv-proc-item { font-size: 13px; color: #374151; font-weight: 600; }
    .pv-proc-arrow { font-size: 12px; color: #94a3b8; }
    .pv-sched-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 8px; }
    .pv-sched-card { background: white; border-radius: 8px; padding: 12px 14px; border: 1px solid #e5e7eb; }
    .pv-sched-title { font-size: 10px; color: #6b7280; font-weight: 700; margin-bottom: 4px; letter-spacing: .05em; }
    .pv-sched-val { font-size: 12px; font-weight: 700; color: #111827; word-break: keep-all; line-height: 1.4; }

    /* Section 04: Departments */
    .pv-s04 { width: 600px; background: white; padding: 36px 56px; border-bottom: 1px solid #e8ecf0; }
    .pv-dept-table { width: 100%; border-collapse: collapse; margin-top: 14px; }
    .pv-dept-table th {
      color: white; font-size: 11px; font-weight: 700;
      padding: 10px 12px; text-align: left; letter-spacing: .05em;
    }
    .pv-dept-table td {
      padding: 12px; font-size: 12px; color: #1f2937;
      vertical-align: top; word-break: keep-all; white-space: pre-wrap;
      border-bottom: 1px solid #e5e7eb; line-height: 1.7;
    }
    .pv-dept-table tr:last-child td { border-bottom: none; }
    .pv-dept-table tr:nth-child(even) td { background: #f9fafb; }
    .pv-dept-tag {
      display: inline-block; padding: 3px 10px; border-radius: 20px;
      font-size: 11px; font-weight: 700;
    }
    .pv-empty {
      font-size: 13px; color: #d1d5db; text-align: center; padding: 24px 0;
    }

    /* Section 05: Fixed image */
    .pv-s05 { width: 600px; }
    .pv-s05 img { width: 100%; display: block; }
  </style>
</head>
<body>

<!-- ══════════════════ GNB ══════════════════ -->
<header class="bg-white border-b border-gray-200 sticky top-0 z-50" style="box-shadow:0 1px 4px rgba(0,0,0,.06);">
  <div class="flex items-center justify-between px-5" style="height:54px;">

    <!-- Logo -->
    <span class="gnb-logo">career</span>

    <!-- Step Nav -->
    <nav class="flex items-center gap-0.5" id="step-nav" aria-label="작성 단계"></nav>

    <!-- Actions -->
    <div class="flex items-center gap-2.5 flex-shrink-0">
      <span id="save-label" class="text-xs text-gray-400 flex items-center gap-1 whitespace-nowrap">
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/>
        </svg>
        임시저장됨 -
      </span>
      <button onclick="doSave()" class="px-3.5 py-1.5 text-xs font-bold text-gray-600 bg-gray-100 hover:bg-gray-200 rounded-lg border border-gray-200 transition-colors">
        임시저장
      </button>
      <button id="next-btn" onclick="nextStep()" class="px-4 py-1.5 text-sm font-bold text-white bg-blue-600 hover:bg-blue-700 rounded-lg shadow-sm transition-colors flex items-center gap-1">
        다음 단계 →
      </button>
    </div>
  </div>
</header>

<!-- ══════════════════ 3-COLUMN LAYOUT ══════════════════ -->
<div class="flex" style="height:calc(100vh - 54px); overflow:hidden;">

  <!-- LEFT: Global Settings -->
  <aside class="bg-white border-r border-gray-200 flex-shrink-0 overflow-y-auto" style="width:184px;">
    <div class="p-4 space-y-5">

      <!-- Template -->
      <div>
        <label class="block text-xs font-bold text-gray-500 uppercase tracking-widest mb-1.5">템플릿</label>
        <select id="sel-template" class="f-input text-sm" style="padding:7px 10px;"
          onchange="S.template = this.value; scheduleAutoSave();">
          <option value="A">기본 템플릿 A</option>
          <option value="B">심플 템플릿 B</option>
          <option value="C">다크 템플릿 C</option>
        </select>
      </div>

      <!-- Corporation -->
      <div>
        <label class="block text-xs font-bold text-gray-500 uppercase tracking-widest mb-1.5">브랜드 / 법인</label>
        <select id="sel-corp" class="f-input text-sm" style="padding:7px 10px;"
          onchange="onCorpChange(this.value)">
          <option value="es">대학내일ES</option>
          <option value="daehak">대학내일</option>
          <option value="campus">캠퍼스픽</option>
          <option value="school">내일학교</option>
          <option value="economy">경제연구소</option>
          <option value="research">20대연구소</option>
          <option value="editors">에디터스</option>
        </select>
      </div>

      <!-- Accent Color -->
      <div>
        <label class="block text-xs font-bold text-gray-500 uppercase tracking-widest mb-2">강조 컬러</label>
        <div class="flex flex-wrap gap-2 items-center" id="swatches">
          <button class="color-swatch" data-c="#29c4e0" style="background:#29c4e0" onclick="onColorPick('#29c4e0',this)" title="하늘색"></button>
          <button class="color-swatch" data-c="#2563eb" style="background:#2563eb" onclick="onColorPick('#2563eb',this)" title="파란색"></button>
          <button class="color-swatch" data-c="#06b6d4" style="background:#06b6d4" onclick="onColorPick('#06b6d4',this)" title="청록색"></button>
          <button class="color-swatch" data-c="#f97316" style="background:#f97316" onclick="onColorPick('#f97316',this)" title="주황색"></button>
          <button class="color-swatch" data-c="#8b5cf6" style="background:#8b5cf6" onclick="onColorPick('#8b5cf6',this)" title="보라색"></button>
          <button class="color-swatch" data-c="#10b981" style="background:#10b981" onclick="onColorPick('#10b981',this)" title="초록색"></button>
          <button class="color-swatch" data-c="#ef4444" style="background:#ef4444" onclick="onColorPick('#ef4444',this)" title="빨간색"></button>
          <label class="color-swatch flex items-center justify-center relative cursor-pointer"
            style="background:#f1f5f9;border:2px dashed #cbd5e1;font-size:14px;color:#94a3b8;" title="커스텀 컬러">
            +
            <input type="color" class="absolute opacity-0 inset-0 w-full h-full cursor-pointer"
              onchange="onColorPick(this.value, null)">
          </label>
        </div>
      </div>

      <div class="border-t border-gray-100 pt-4">
        <p class="text-xs text-gray-400 leading-relaxed">법인별 배경 이미지는<br/>추후 업데이트 예정입니다.</p>
      </div>
    </div>
  </aside>

  <!-- CENTER: Step Form -->
  <main class="flex-1 overflow-y-auto bg-gray-50" style="min-width:0;">
    <div class="max-w-lg mx-auto py-6 px-5" id="center-form">
      <!-- JS로 렌더링 -->
    </div>
  </main>

  <!-- RIGHT: Live Preview -->
  <section class="bg-slate-100 border-l border-gray-200 flex-shrink-0 flex flex-col" style="width:660px;">
    <!-- Header -->
    <div class="bg-white border-b border-gray-200 px-5 py-2.5 flex items-center justify-between flex-shrink-0">
      <div class="flex items-center gap-2">
        <span class="text-sm font-bold text-gray-800">미리보기</span>
        <span class="text-xs px-2 py-0.5 rounded-full font-bold border"
          style="background:#eff6ff;color:#2563eb;border-color:#bfdbfe;">실시간</span>
      </div>
      <div class="flex items-center gap-2 text-xs text-gray-400">
        <span>600px 기준</span>
        <span class="w-2 h-2 rounded-full bg-green-400" style="animation:pulse 2s infinite;"></span>
      </div>
    </div>
    <!-- Scrollable canvas -->
    <div class="flex-1 overflow-y-auto overflow-x-auto p-5 flex justify-center" id="preview-wrap">
      <div id="preview-canvas" class="rounded overflow-hidden"
        style="box-shadow:0 4px 32px rgba(0,0,0,.18); align-self:flex-start;">
      </div>
    </div>
  </section>

</div><!-- end 3-col -->

// ─────────────────────────────────────────────────────────────
// LOCAL STORAGE
// ─────────────────────────────────────────────────────────────
function doSave() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(S));
  const now = new Date();
  const t = now.toTimeString().slice(0,5);
  const el = document.getElementById('save-label');
  if (el) {
    el.innerHTML = `<svg class="w-3.5 h-3.5" style="color:#16a34a" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg> 임시저장됨 ${t}`;
    el.style.color = '#16a34a';
    setTimeout(() => { el.style.color = ''; }, 3000);
  }
}

let _saveTimer = null;
function scheduleAutoSave() {
  clearTimeout(_saveTimer);
  _saveTimer = setTimeout(doSave, 1800);
}

function loadSaved() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return false;
    const parsed = JSON.parse(raw);
    // 안전하게 병합
    Object.keys(S).forEach(k => { if (parsed[k] !== undefined) S[k] = parsed[k]; });
    return true;
  } catch(e) { return false; }
}

// ─────────────────────────────────────────────────────────────
// STEP NAVIGATION
// ─────────────────────────────────────────────────────────────
function goToStep(n) {
  // 현재 스텝 폼 데이터 수집 후 이동
  collectCurrentStep();
  S.currentStep = n;
  renderAll();
}
function nextStep() {
  if (S.currentStep < 4) goToStep(S.currentStep + 1);
}

function renderStepNav() {
  const nav = document.getElementById('step-nav');
  if (!nav) return;
  let html = '';
  STEP_LABELS.forEach((lbl, i) => {
    const step = i + 1;
    const isActive = step === S.currentStep;
    const isDone   = step < S.currentStep;
    const cls = isActive ? 'step-active' : (isDone ? 'step-done' : 'step-idle');
    html += `<button class="step-pill ${cls}" onclick="goToStep(${step})">
      <span class="step-pill-num">${step}</span>
      <span style="font-size:12px;">${lbl}</span>
    </button>`;
    if (i < 3) html += `<span style="color:#d1d5db;font-size:14px;padding:0 1px;">›</span>`;
  });
  nav.innerHTML = html;
  const nb = document.getElementById('next-btn');
  if (nb) nb.innerHTML = S.currentStep === 4 ? '완료 ✓' : '다음 단계 →';
}

    const sc = document.getElementById('f-sub-copy');
    if (b)  S.badge    = b.value;
    if (m)  S.mainCopy = m.value;
    if (sc) S.subCopy  = sc.value;
  } else if (step === 2) {
    const p   = document.getElementById('f-period');
    const doc = document.getElementById('f-doc');
    const inv = document.getElementById('f-interview');
    const ann = document.getElementById('f-announce');
    if (p)   S.period       = p.value;
    if (doc) S.docDeadline  = doc.value;
    if (inv) S.interviewDate= inv.value;
    if (ann) S.announceDate = ann.value;
  }
  // STEP 3은 updateDept()로 실시간 반영됨
}

function onCorpChange(val) {
  S.corp = val;
  const info = CORP[val];
  if (info) {
    S.accentColor = info.color;
    syncSwatches();
  }
  renderPreview();
  scheduleAutoSave();
}

function onColorPick(color, btn) {
  S.accentColor = color;
  syncSwatches();
  renderPreview();
  scheduleAutoSave();
}

function syncSwatches() {
  document.querySelectorAll('.color-swatch[data-c]').forEach(sw => {
    sw.classList.toggle('on', sw.dataset.c === S.accentColor);
  });
}

function selectPattern(idx) {
  S.patternIdx = idx;
  document.querySelectorAll('.pat-btn').forEach((b, i) => b.classList.toggle('on', i === idx));
  renderPreview();
  scheduleAutoSave();
}

function syncSidebar() {
  const st = document.getElementById('sel-template');
  const sc = document.getElementById('sel-corp');
  if (st) st.value = S.template;
  if (sc) sc.value = S.corp;
  syncSwatches();
}

// ─────────────────────────────────────────────────────────────
// FORM RENDERERS
// ─────────────────────────────────────────────────────────────
function renderCenterForm() {
  const el = document.getElementById('center-form');
  if (!el) return;
  el.innerHTML = '';
  const wrap = document.createElement('div');
  wrap.className = 'step-anim';
  if      (S.currentStep === 1) wrap.innerHTML = buildStep1();
  else if (S.currentStep === 2) wrap.innerHTML = buildStep2();
  else if (S.currentStep === 3) wrap.innerHTML = buildStep3();
  else                          wrap.innerHTML = buildStep4();
  el.appendChild(wrap);
  attachFormListeners();
}

// ─── 이벤트 리스너 부착 (renderCenterForm 후 한 번에) ───
function attachFormListeners() {
  const step = S.currentStep;

  if (step === 1) {
    bindInput('f-badge',     v => { S.badge    = v; updateCnt('f-badge','cnt-badge',20); });
    bindInput('f-main-copy', v => { S.mainCopy = v; updateCnt('f-main-copy','cnt-main',60); });
    bindInput('f-sub-copy',  v => { S.subCopy  = v; updateCnt('f-sub-copy','cnt-sub',30); });
    // 패턴 버튼 동기화
    document.querySelectorAll('.pat-btn').forEach((b, i) => b.classList.toggle('on', i === S.patternIdx));
    // 카운터 초기화
    updateCnt('f-badge','cnt-badge',20);
    updateCnt('f-main-copy','cnt-main',60);
    updateCnt('f-sub-copy','cnt-sub',30);
  }
  if (step === 2) {
    bindInput('f-period',    v => { S.period        = v; });
    bindInput('f-doc',       v => { S.docDeadline   = v; });
    bindInput('f-interview', v => { S.interviewDate = v; });
    bindInput('f-announce',  v => { S.announceDate  = v; });
  }
}

// 공통 input/textarea 이벤트 바인딩: 값 변경 즉시 상태 저장 + 미리보기 갱신
function bindInput(id, setter) {
  const el = document.getElementById(id);
  if (!el) return;
  el.addEventListener('input', () => {
    setter(el.value);
    renderPreview();
    scheduleAutoSave();
  });
}

function updateCnt(inputId, cntId, max) {
  const inp = document.getElementById(inputId);
  const cnt = document.getElementById(cntId);
  if (!inp || !cnt) return;
  const len = inp.value.length;
  cnt.textContent = `${len}/${max}`;
  cnt.className = 'char-cnt' + (len > max ? ' over' : '');
}

function buildProcTags() {
  return S.procedures.map((p, i) =>
    `<span class="proc-tag">
      ${i > 0 ? '<span style="color:#93c5fd;margin-right:3px;">›</span>' : ''}
      ${htmlEsc(p)}

  ).join('');
}

function addProc() {
  const inp = document.getElementById('proc-new');
  if (!inp) return;
  const val = inp.value.trim();
  if (!val) return;
  S.procedures.push(val);
  inp.value = '';
  const area = document.getElementById('proc-tags');
  if (area) area.innerHTML = buildProcTags();
  renderPreview();
  scheduleAutoSave();
}

  S.procedures.splice(i, 1);
  const area = document.getElementById('proc-tags');

}

// ★★★ renderPreview — 상태(S)를 읽어 미리보기 전체를 재구성 ★★★

function renderPreview() {
  const canvas = document.getElementById('preview-canvas');
  if (!canvas) return;

  const corp    = CORP[S.corp] || CORP['es'];
  const color   = S.accentColor;
  const pat     = PATTERNS[S.patternIdx];

  // ── 섹션 01: 메인 비주얼 ──
  const mainCopyText = S.mainCopy || '함께 성장할\n동료를 찾습니다.';
  const s01 = `
<div class="pv-s01" style="background:${pat.g};">
  <img class="pv-s01-bg" src="${BG_DATA_URI}" alt="" />
  <div class="pv-s01-wash" style="background:${color};"></div>
  <div class="pv-s01-inner">
    <span class="pv-badge">${htmlEsc(S.badge) || '채용 공고'}</span>
    <div class="pv-main-copy">${htmlEsc(mainCopyText)}</div>
    ${S.subCopy ? `<div class="pv-sub-copy">${htmlEsc(S.subCopy)}</div>` : ''}
  </div>
  <div class="pv-corp-badge">${htmlEsc(corp.name)}</div>
</div>`;

  // ── 섹션 02: 회사 소개 ──
  const s02 = `
<div class="pv-s02">
  <div class="pv-sec-label" style="color:${color};">ABOUT US</div>
  <div class="pv-heading">${htmlEsc(corp.heading)}</div>
  <div class="pv-body">${htmlEsc(corp.intro)}</div>
</div>`;

  // ── 섹션 03: 모집요강 ──
  let s03body = '';

  if (S.period) {
    s03body += `<div class="pv-info-block">
      <div class="pv-sec-label" style="color:${color};">지원기간</div>
      <div class="pv-info-val">${htmlEsc(S.period)}</div>
    </div>`;
  }

  if (S.procedures.length > 0) {
    const procItems = S.procedures.map((p, i) =>
      `${i > 0 ? '<span class="pv-proc-arrow">→</span>' : ''}
       <span class="pv-proc-item">${htmlEsc(p)}</span>`
    ).join('');
    s03body += `<div class="pv-info-block">
      <div class="pv-sec-label" style="color:${color};">전형 절차</div>
      <div class="pv-proc-list">${procItems}</div>
    </div>`;
  }

  const schedCards = [
    S.docDeadline   ? `<div class="pv-sched-card"><div class="pv-sched-title">📋 서류 마감</div><div class="pv-sched-val">${htmlEsc(S.docDeadline)}</div></div>`   : '',
    S.interviewDate ? `<div class="pv-sched-card"><div class="pv-sched-title">🎤 면접일</div><div class="pv-sched-val">${htmlEsc(S.interviewDate)}</div></div>` : '',
    S.announceDate  ? `<div class="pv-sched-card"><div class="pv-sched-title">📣 최종 발표</div><div class="pv-sched-val">${htmlEsc(S.announceDate)}</div></div>`  : ''
  ].filter(Boolean).join('');

  if (schedCards) {
    s03body += `<div class="pv-info-block">
      <div class="pv-sec-label" style="color:${color};">전형 일정</div>
      <div class="pv-sched-grid">${schedCards}</div>
    </div>`;
  }

  if (!s03body) {
    s03body = `<p class="pv-empty">STEP 2에서 모집요강을 입력해주세요</p>`;
  }

  const s03 = `<div class="pv-s03">${s03body}</div>`;

  // ── 섹션 04: 모집부문 ──
  let s04;
  if (S.departments.length > 0) {
    const rows = S.departments.map(d => {
      const bg = hexRgba(color, 0.1);
      return `<tr>
        <td><span class="pv-dept-tag" style="background:${bg};color:${color};">${htmlEsc(d.category||'-')}</span></td>
        <td style="font-weight:700;font-size:13px;">${htmlEsc(d.title||'-')}</td>
        <td>${htmlEsc(d.tasks||'-')}</td>
      </tr>`;
    }).join('');
    s04 = `<div class="pv-s04">
      <div class="pv-sec-label" style="color:${color};">모집부문</div>
      <table class="pv-dept-table">
        <thead><tr>
          <th style="width:18%;background:${color};">분류</th>
          <th style="width:24%;background:${color};">직무명</th>
          <th style="background:${color};">주요 업무</th>
        </tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>`;
  } else {
    s04 = `<div class="pv-s04">
      <div class="pv-sec-label" style="color:${color};">모집부문</div>
      <p class="pv-empty">STEP 3에서 모집 부문을 추가해주세요</p>
    </div>`;
  }

  // ── 섹션 05: 고정 이미지 ──
  const s05 = `<div class="pv-s05"><img src="${INTRO_DATA_URI}" alt="복리후생 및 회사소개" /></div>`;

  // 한 번에 DOM 업데이트 (리플로우 최소화)
  canvas.innerHTML = s01 + s02 + s03 + s04 + s05;
}

// ─────────────────────────────────────────────────────────────
// DOWNLOAD
// ─────────────────────────────────────────────────────────────
async function downloadImage() {
  const btn    = document.getElementById('dl-btn');
  const canvas = document.getElementById('preview-canvas');
  if (!btn || !canvas) return;

  btn.disabled = true;
  btn.innerHTML = '⏳ &nbsp;이미지 캡처 중...';

  await new Promise(r => setTimeout(r, 300));

  try {
    const result = await html2canvas(canvas, {
      scale: 2,
      useCORS: true,
      allowTaint: true,
      backgroundColor: '#ffffff',
      scrollX: 0, scrollY: 0,
      width: canvas.scrollWidth,
      height: canvas.scrollHeight,
      windowWidth: canvas.scrollWidth,
      windowHeight: canvas.scrollHeight,
      logging: false,
      imageTimeout: 15000
    });

    const corp = CORP[S.corp] || CORP['es'];
    const now  = new Date();
    const ds   = now.getFullYear() + pad2(now.getMonth()+1) + pad2(now.getDate());
    const a    = document.createElement('a');
    a.download = `채용공고_${corp.name}_${ds}.png`;
    a.href     = result.toDataURL('image/png', 1.0);
    a.click();

    btn.disabled = false;
    btn.innerHTML = '✅ &nbsp;다운로드 완료!';
    setTimeout(() => { btn.innerHTML = '📷 &nbsp;채용 공고 이미지 다운로드'; }, 3000);
  } catch (e) {
    console.error(e);
    btn.disabled = false;
    btn.innerHTML = '❌ &nbsp;오류 발생 - 다시 시도해주세요';
    setTimeout(() => { btn.innerHTML = '📷 &nbsp;채용 공고 이미지 다운로드'; }, 3000);
  }
}

// ─────────────────────────────────────────────────────────────
// UTILS
// ─────────────────────────────────────────────────────────────
function htmlEsc(str) {
  if (str === null || str === undefined) return '';
  return String(str)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;');
}

function hexRgba(hex, a) {
  if (!hex || hex.length < 7) return `rgba(0,0,0,${a})`;
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${a})`;
}

function pad2(n) { return String(n).padStart(2,'0'); }

// ─────────────────────────────────────────────────────────────
// RENDER ALL
// ─────────────────────────────────────────────────────────────
function renderAll() {
  renderStepNav();
  renderCenterForm();
  renderPreview();

}

  }
});
